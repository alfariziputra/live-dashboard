  st.innerHTML=ks.length>1?ks.map(k=>{ if(ORDER.includes(k)){const md=model(k);return `<button class="stab" data-k="${k}">${M[k].short} ${YEAR}<small>${md.complete?"full":"day 1–"+M[k].days[md.last].day}</small></button>`;} return `<button class="stab" data-k="${k}">${NAMES[k]}</button>`;}).join(""):"";
  st.classList.toggle("hidden",ks.length<2);
  st.querySelectorAll(".stab").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.k===state.month);b.onclick=()=>{state.month=b.dataset.k;rerender();};});
  const on=st.querySelector('.stab[aria-pressed="true"]'); if(on) st.scrollLeft=Math.max(0,on.offsetLeft-st.clientWidth/2+on.offsetWidth/2);
}
function rerender(){
  killCharts();
  buildTabs();
  (VIEWS[state.month]||(()=>renderMonth(state.month)))();
  try{ history.replaceState(null,"","#"+(state.month==="me"&&state.me?"me="+encodeURIComponent(state.me):state.month)); }catch(e){}
  const {k:lastK,md}=LATEST();
  document.getElementById("asof").innerHTML=`Data through<b>${M[lastK].label.split(' ')[0]} ${M[lastK].days[md.last].day}, ${YEAR}</b>`;
  bindLogLinks();
}
(function route(){
  const h=decodeURIComponent((location.hash||"").replace("#",""));
  if(h.startsWith("me")){state.month="me";const nm=h.split("=")[1];if(nm) state.me=nm;}
  else if(ORDER.includes(h)||VIEWS[h]) state.month=h;
  else { try{ if(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches&&localStorage.getItem("migo_me")) state.month="me"; }catch(e){} }
  if(!ORDER.includes(state.month)&&!VIEWS[state.month]) state.month=LATEST().k;
  if(ORDER.includes(state.month)&&model(state.month).last<0) state.month=LATEST().k;
})();
window.addEventListener("hashchange",()=>{const h=decodeURIComponent(location.hash.replace("#",""));if(h.startsWith("me=")){state.month="me";state.me=h.split("=")[1];rerender();}});
rerender();
document.getElementById("btnBrief").onclick=openBrief;
loadReports(); loadMaster(); loadActions(); lgStart();
if(typeof Chart==="undefined") document.getElementById("main").insertAdjacentHTML("afterbegin",`<div class="note">Charts could not load (Chart.js CDN blocked). Tables below still work.</div>`);
/* ---------- auto-update: poll for new data, no manual refresh needed ---------- */
function deepSet(t,s){
  if(Array.isArray(t)&&Array.isArray(s)){ t.length=s.length; s.forEach((v,i)=>{ if(v&&typeof v==="object"&&t[i]&&typeof t[i]==="object"&&Array.isArray(t[i])===Array.isArray(v)) deepSet(t[i],v); else t[i]=v; }); return; }
  Object.keys(t).forEach(k=>{ if(!(k in s)) delete t[k]; });
  Object.keys(s).forEach(k=>{ const v=s[k]; if(v&&typeof v==="object"&&t[k]&&typeof t[k]==="object"&&Array.isArray(t[k])===Array.isArray(v)) deepSet(t[k],v); else t[k]=v; });
}
let LIVE_SIG=JSON.stringify(DATA), LIVE_BUSY=false;
function liveToast(msg){
  let t=document.getElementById("liveToast");
  if(!t){t=document.createElement("div");t.id="liveToast";t.setAttribute("role","status");t.style.cssText="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink,#111);color:var(--surface,#fff);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:99;transition:opacity .4s;opacity:0;pointer-events:none";document.body.appendChild(t);}
  t.textContent=msg; t.style.opacity="1"; clearTimeout(t._h); t._h=setTimeout(()=>{t.style.opacity="0";},4000);
}
function checkLive(){
  if(location.protocol==="file:"||LIVE_BUSY||document.hidden) return;
  LIVE_BUSY=true;
  fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():null).then(txt=>{
    if(!txt) return;
    const m=txt.match(/const DATA = (\{.*?\});\n/s); if(!m) return;
    const next=JSON.parse(m[1]), sig=JSON.stringify(next);
    if(sig!==LIVE_SIG){
      const ae=document.activeElement; if(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)) return; // don't interrupt typing; retry next tick
      deepSet(DATA,next); LIVE_SIG=sig; rerender(); liveToast("Data updated");
    }
    loadReports(); loadMaster(); loadActions();
  }).catch(()=>{}).finally(()=>{LIVE_BUSY=false;});
}
setInterval(checkLive,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) checkLive();});
window.addEventListener("focus",checkLive);
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
