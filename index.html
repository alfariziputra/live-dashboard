<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Live GMV Dashboard</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#f8f8f6; --line:#e4e3de; --grid:#ecebe7;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a8984;
  --hdr:#10223d; --hdr-ink:#ffffff; --hdr-ink-2:rgba(255,255,255,.62);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --target:#0b0b0b;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --bad:#d03b3b; --bad-ink:#a42a2a;
  --good-bg:#e6f5e6; --warn-bg:#fdf1d3; --bad-bg:#fae6e6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
header{background:var(--hdr);color:var(--hdr-ink);padding:22px 32px 0}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:20px;font-weight:650;letter-spacing:-.2px}
.sub{font-size:12.5px;color:var(--hdr-ink-2);margin-top:3px}
.asof{font-size:12px;color:var(--hdr-ink-2);text-align:right}
.asof b{color:var(--hdr-ink);font-weight:600;display:block;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:20px;overflow-x:auto}
.tab{appearance:none;border:0;background:transparent;color:var(--hdr-ink-2);font:inherit;font-weight:600;font-size:13.5px;padding:10px 20px;border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--hdr-ink)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab small{font-weight:500;opacity:.7;margin-left:6px;font-size:11px}
main{max-width:1320px;margin:0 auto;padding:22px 32px 48px}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--s1);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);font-weight:600}
.kpi .v{font-size:22px;font-weight:650;margin-top:5px;letter-spacing:-.4px}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:99px}
.pill.good{background:var(--good-bg);color:var(--good-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.bad{background:var(--bad-bg);color:var(--bad-ink)}
.pill.flat{background:var(--surface-2);color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.card h2{font-size:14px;font-weight:650}
.card .hint{font-size:12px;color:var(--ink-3);margin-top:2px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px}
.grid2 .card{margin-bottom:0}
.sec{margin-bottom:18px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);padding:5px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.chartbox{position:relative;height:300px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:2px;width:14px;border-radius:0;vertical-align:3px}
.legend i.dash{height:0;width:14px;border-top:2px dashed;background:none;border-radius:0;vertical-align:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:650;border-top:1px solid var(--line);background:var(--surface-2)}
.rank{color:var(--ink-3);width:24px;display:inline-block}
.bar{display:inline-block;vertical-align:middle;width:56px;height:7px;background:var(--grid);border-radius:4px;overflow:hidden;margin-right:8px}
.bar>span{display:block;height:100%;border-radius:4px}
.muted{color:var(--ink-3)}
.pos{color:var(--good-ink)} .neg{color:var(--bad-ink)}
.scroll{overflow-x:auto}
.brandwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:center}
.brandwrap .chartbox{height:170px;max-width:220px;margin:0 auto;width:100%}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hl>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.hl .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);font-weight:600}
.hl .b{font-weight:650;font-size:15px;margin-top:2px}
.hl .d{font-size:12px;color:var(--ink-2)}
.picrow{display:grid;grid-template-columns:90px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid)}
.picrow:last-child{border-bottom:0}
.picrow .n{font-weight:650}
.picrow .a{font-size:11.5px;color:var(--ink-3)}
.picrow .tr{height:9px;background:var(--grid);border-radius:5px;overflow:hidden;position:relative}
.picrow .tr>span{display:block;height:100%;border-radius:5px}
.picrow .tr:after{content:"";position:absolute;left:100%;top:-2px;bottom:-2px;width:0}
.picrow .p{text-align:right;font-weight:650}
details.card>summary{cursor:pointer;font-weight:650;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-summary{display:none}
details.card>summary::after{content:"Show ▾";font-size:12px;color:var(--ink-3);font-weight:600}
details.card[open]>summary::after{content:"Hide ▴"}
.cell{display:inline-block;min-width:46px;text-align:center;border-radius:5px;padding:1px 5px;font-size:12px;font-weight:600}
.cell.good{background:var(--good-bg);color:var(--good-ink)}
.cell.warn{background:var(--warn-bg);color:var(--warn-ink)}
.cell.bad{background:var(--bad-bg);color:var(--bad-ink)}
.cell.none{color:var(--ink-3)}
.ev{font-size:10.5px;font-weight:650;color:var(--s2);margin-left:6px}

.act{border-left:4px solid var(--bad)}
.act.ok{border-left-color:var(--good)}
.act .std{font-size:12px;color:var(--ink-2);margin-top:2px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.ac{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ac .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ac .rk{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--bad-ink)}
.ac .nm{font-size:16px;font-weight:700;margin-top:6px}
.ac .pc{font-size:12px;color:var(--ink-3)}
.ac .big{display:flex;gap:18px;margin-top:10px}
.ac .big div{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px}
.ac .big b{display:block;font-size:17px;color:var(--ink);text-transform:none;letter-spacing:-.2px;margin-top:2px}
.ac .dx{font-size:12.5px;color:var(--ink-2);margin-top:10px;line-height:1.5}
.ac .dx b{color:var(--ink)}
.ac .todo{font-size:12.5px;margin-top:8px;padding:8px 10px;background:var(--bad-bg);color:var(--bad-ink);border-radius:7px;line-height:1.45}
.ac .warnx{font-size:11.5px;margin-top:8px;color:var(--warn-ink)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:var(--bad-bg);color:var(--bad-ink);border-radius:4px;padding:1px 6px;margin-left:8px}
@media (max-width:1000px){.acts{grid-template-columns:1fr}}

.snap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.snap .sh{background:#16213a;color:#fff;padding:22px 26px 18px}
.snap .srow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.snap h2{font-size:19px;font-weight:700;letter-spacing:-.3px}
.snap .ss{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:4px}
.snap .sd{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 16px;text-align:center}
.snap .sd b{display:block;font-size:15px}
.snap .sd span{font-size:10.5px;color:rgba(255,255,255,.55)}
.snap .tp{display:flex;align-items:center;gap:14px;margin-top:18px;font-size:12.5px;color:rgba(255,255,255,.65)}
.snap .tpb{flex:1;height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.snap .tpb i{display:block;height:100%;background:#5b9cf5;border-radius:4px}
.snap .tpv{font-weight:700;color:#7db0ff;font-size:14px}
.snap table{width:100%}
.snap th{background:var(--surface-2)}
.snap td{padding:13px 12px}
.snap .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;font-size:13.5px;white-space:nowrap}
.snap .sub{display:block;font-family:inherit;font-size:11px;font-weight:600;margin-top:3px}
.snap .sub.pos{color:var(--good-ink)}.snap .sub.neg{color:var(--bad-ink)}
.snap .rk2{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--grid);align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.snap .gp{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px}
.snap .gp.pos{background:var(--good-bg);color:var(--good-ink)}.snap .gp.neg{background:var(--bad-bg);color:var(--bad-ink)}

#tDaily{border-collapse:separate;border-spacing:0;min-width:1100px}
#tDaily thead th{background:#1a1f2b;color:#fff;font-size:11.5px;text-transform:none;letter-spacing:0;padding:10px 10px;position:sticky;top:0}
#tDaily thead th small{display:block;font-weight:500;color:rgba(255,255,255,.55);font-size:10.5px;margin-top:2px}
#tDaily thead th:first-child{border-top-left-radius:8px}#tDaily thead th:last-child{border-top-right-radius:8px}
#tDaily td{padding:9px 10px;white-space:nowrap}
#tDaily .dcol{position:sticky;left:0;background:var(--surface);z-index:1;min-width:120px}
#tDaily thead .dcol{background:#1a1f2b}
#tDaily .gc{font-weight:650}#tDaily .gc span{font-weight:500;font-size:11.5px}
#tDaily .gc.good{color:var(--good-ink)}#tDaily .gc.warn{color:var(--warn-ink)}#tDaily .gc.bad{color:var(--bad-ink)}
#tDaily .pos{color:var(--good-ink)}#tDaily .neg{color:var(--bad-ink)}
#tDaily tr.nodata td{color:var(--ink-3)}
#tDaily tr.tot td{background:var(--surface-2);font-weight:700}#tDaily tr.tot .dcol{background:var(--surface-2)}

.ov .kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 16px}
.ov .kp div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ov .kp small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);font-weight:600}
.ov .kp b{display:block;font-size:20px;margin-top:4px;letter-spacing:-.3px}
.ov .kp span{font-size:12px;color:var(--ink-2)}
.ov .chn{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;background:var(--grid);color:var(--ink-2)}
.ov .chn.sp{background:#fde8dc;color:#a8441a}.ov .chn.tk{background:#e3edfb;color:#1d58a8}
.ov .gp{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;white-space:nowrap}.ov .gp.pos{background:var(--good-bg);color:var(--good-ink)}.ov .gp.neg{background:var(--bad-bg);color:var(--bad-ink)}
.ov tr.ovt td{background:var(--surface-2);font-weight:700}
@media (max-width:1000px){.ov .kp{grid-template-columns:repeat(2,minmax(0,1fr))}}
footer{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.7}
.hidden{display:none!important}
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  main{padding:16px}
  header{padding:18px 16px 0}
  .brandwrap{grid-template-columns:1fr}
}
</style>
</head>

/* ---------- render: month view ---------- */
function renderMonth(k){
  const md=model(k), m=md.m, pk=prevOf(k), pmd=pk?model(pk):null;
  const main=document.getElementById("main");
  const last=md.last;
  if(last<0){ main.innerHTML=`<div class="card">No data yet for ${m.label}.</div>`; return; }
  const mtdAct=sum(md.actDay.slice(0,last+1)), mtdTgt=sum(md.tgtDay.slice(0,last+1).filter((v,i)=>md.hasData[i]));
  const monthlyTgt=md.m.target||sum(md.tgtDay);
  const pace=mtdAct/mtdTgt*100, ofMonth=mtdAct/monthlyTgt*100;
  const proj = md.complete?mtdAct:monthlyTgt*(pace/100);
  let prevSame=null, prevLabel="";
  if(pmd){ prevSame=sum(pmd.actDay.slice(0,last+1).filter((v,i)=>md.hasData[i])); prevLabel=pmd.m.label; }
  const st=status(pace);
  const daysLeft=md.n-(last+1);

  // data gaps
  const gaps=[];
  m.days.forEach((d,i)=>{ if(!md.hasData[i]) return; ACCTS.forEach(a=>{ if((m.tgt[a][i]||0)>0 && m.g[a][i]==null) gaps.push(`${SHORT[a]} ${m.short} ${d.day}`); }); });


  /* ---- action needed (warning system) ---- */
  const STD=85;
  const stA=acctStats(md,last);
  const below=stA.filter(s=>s.ach!=null&&s.ach<STD).map(s=>({...s,gap:s.t-s.g})).sort((x,y)=>y.gap-x.gap);
  const needSet=new Set(below.map(s=>s.a));
  const top3=below.slice(0,3);
  function diag(a){
    const idx=[];m.days.forEach((d,i)=>{ if(md.hasData[i]) idx.push(i); });
    const agg=(mm,ix)=>{let v=0,o=0,g=0;ix.forEach(i=>{v+=mm.views[a][i]||0;o+=mm.orders[a][i]||0;g+=mm.g[a][i]||0;});return {v,o,conv:v>0?o/v*1000:0,g};};
    let cur,base,bl;
    if(pmd){ cur=agg(m,idx); base=agg(pmd.m,idx.filter(i=>i<pmd.n)); bl="vs "+pmd.m.label.split(" ")[0]; }
    else if(idx.length>=14){ const r=idx.slice(-7), e=idx.slice(0,-7); cur=agg(m,r); base=agg(m,e); const sc=e.length/7; base={v:base.v/sc,o:base.o/sc,conv:base.conv,g:base.g/sc}; bl="last 7 days vs earlier days"; }
    else return null;
    const dv=base.v>0?(cur.v/base.v-1)*100:null, dc=base.conv>0?(cur.conv/base.conv-1)*100:null;
    return {dv,dc,bl};
  }
  function advice(d){
    if(!d||d.dv==null||d.dc==null) return {t:"Not enough history to diagnose.",a:"Review the account's live schedule and target."};
    const f=x=>Math.round(x)===0?"0%":(x>0?"+":"−")+Math.abs(x).toFixed(0)+"%";
    const txt=`Views <b>${f(d.dv)}</b> · orders per 1K views <b>${f(d.dc)}</b> (${d.bl})`;
    if(d.dv<=-10&&d.dv<=d.dc) return {t:txt,a:"Traffic is the main problem: check live hours, number of sessions, host schedule and traffic boost."};
    if(d.dc<=-10) return {t:txt,a:"Conversion is the main problem: check product mix, vouchers / flash deals, price and host script."};
    return {t:txt,a:"Traffic and conversion are stable vs the benchmark: the target looks too high or sessions are too few. Re-check pacing."};
  }
  const gapsBy=a=>{const r=[];m.days.forEach((d,i)=>{ if(md.hasData[i]&&(m.tgt[a][i]||0)>0&&m.g[a][i]==null) r.push(d.day); });return r;};
  let actHtml;
  if(!top3.length){
    actHtml=`<section class="card act ok"><h2>✔ Action needed: none</h2><div class="std">Every account is at or above the ${STD}% standard (achievement vs target to date).</div></section>`;
  } else {
    actHtml=`<section class="card act"><div class="chead"><div><h2>⚠ Action needed: top ${top3.length} accounts to fix</h2>
      <div class="std">Standard: ≥ ${STD}% of target to date. ${below.length} account${below.length>1?"s":""} below standard${below.length>3?`; showing the 3 with the biggest Rp gap to target`:""}.${below.length>3?` Also below: ${below.slice(3).map(s=>SHORT[s.a]+" "+pct(s.ach,0)).join(", ")}.`:""}</div></div></div><div class="acts">`+
    top3.map((s,i)=>{ const d=diag(s.a), ad=advice(d), gp=gapsBy(s.a);

  /* ---- overall GMV: TikTok + Shopee ---- */
  let ovHtml="";
  const SH=(DATA.shopee||{})[k];
  if(SH){
    const rows=[];
    ACCTS.forEach(a=>{ const b=Object.entries(BRANDS).find(([bn,l])=>l.includes(a))[0];
      rows.push({name:a,brand:b,channel:"TikTok",target:((DATA.targets||{})[k]||{})[a]||sum(m.tgt[a]),gmv:sum(m.g[a].map(v=>v||0)),prev:(DATA.targets&&DATA.targets[pk]&&DATA.targets[pk][a])||null}); });

    ${hasOther?`<div class="hint" style="margin-top:8px">“Other” = Corolla Indonesia (not labelled Shopee or SP in the sheet); counted in the overall total, under the COROLLA brand.</div>`:""}</section>`;
  }

  let html="";

  html+=`<section class="kpis">

  <div>Achievement = GMV ÷ target for the same days. Specialist assignments shown are the current ones and applied to all months. Source: TikTok Live performance exports (Attributed GMV).</div></footer>`;

  const byAch=[...bs].sort((a,b)=>b.ach-a.ach), best=byAch[0], least=byAch[byAch.length-1];
  const bcol=DATA.brandColors;
  let bh=`<div class="hl"><div><div class="t">Best performing brand</div><div class="b">${best.b}</div><div class="d">${pct(best.ach)} of target · ${fmtC(best.g)}</div></div>

    <div class="brandwrap"><div class="chartbox"><canvas id="cBrand" role="img" aria-label="GMV share by brand"></canvas></div>
    <div class="scroll"><table><thead><tr><th class="l">Brand</th><th>GMV</th><th>Share</th><th>Ach.</th></tr></thead><tbody>`;
  [...bs].sort((a,b)=>b.g-a.g).forEach(r=>{
    bh+=`<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(${bcol[r.b]});margin-right:7px"></i>${r.b}</td><td class="num">${fmtC(r.g)}</td><td class="num">${pct(r.share)}</td><td class="num">${pillHtml(r.ach)}</td></tr>`;
  });
  bh+=`</tbody></table></div></div>`;
  document.getElementById("brandBox").innerHTML=bh;
  const sorted=[...bs].sort((a,b)=>b.g-a.g);
  mk("cBrand",{type:"doughnut",data:{labels:sorted.map(r=>r.b),datasets:[{data:sorted.map(r=>r.g),backgroundColor:sorted.map(r=>css(bcol[r.b])),borderColor:css("--surface"),borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{display:false},tooltip:{backgroundColor:css("--surface"),titleColor:css("--ink"),bodyColor:css("--ink-2"),borderColor:css("--line"),borderWidth:1,callbacks:{label:c=>` ${fmtRp(c.raw)} (${pct(c.raw/totG*100)})`}}}}});

  /* PIC */
  const pics={};
  st2.forEach(s=>{ const p=PIC[s.a]||"Unassigned"; (pics[p]=pics[p]||{g:0,t:0,a:[]}); pics[p].g+=s.g; pics[p].t+=s.t; pics[p].a.push(SHORT[s.a]); });
  const pr=Object.entries(pics).map(([p,v])=>({p,...v,ach:v.t>0?v.g/v.t*100:0})).sort((a,b)=>b.ach-a.ach);
  document.getElementById("picBox").innerHTML=pr.map(r=>{
    const c=status(r.ach).c, col=c==="good"?"var(--good)":c==="warn"?"var(--warn)":"var(--bad)";
    return `<div class="picrow"><div><div class="n">${r.p}</div></div><div><div class="tr"><span style="width:${Math.min(r.ach,100)}%;background:${col}"></span></div><div class="a">${r.a.join(", ")} · ${fmtC(r.g)}</div></div><div class="p num">${pct(r.ach)}</div></div>`;
  }).join("");

  /* traffic */
  function drawTraffic(){
    const key=state.traffic, lbl={views:"Views",orders:"Orders",fol:"New followers"}[key];
    document.getElementById("trLbl").textContent=lbl;
    const series=md=>md.m.days.map((d,i)=>md.hasData[i]?sum(ACCTS.map(a=>(md.m[key][a][i])||0)):null);
    const cur=series(md);
    const ds=[{type:"bar",label:lbl,data:cur,backgroundColor:css("--s1"),borderRadius:{topLeft:4,topRight:4},borderSkipped:"bottom",maxBarThickness:22,order:1}];
    if(pmd){ const p=series(pmd); ds.push({type:"line",label:pmd.m.label+" (same day)",data:m.days.map((d,i)=>p[i]!=null?p[i]:null),borderColor:css("--s2"),borderWidth:2,borderDash:[5,4],pointRadius:0,pointHoverRadius:4,tension:.25,order:0}); }
    const o2=baseOpts(); o2.scales.y.ticks.callback=v=>fmtC(v);
    o2.plugins.tooltip.callbacks={title:items=>`${m.short} ${m.days[items[0].dataIndex].day}`,label:c=>c.raw==null?null:` ${c.dataset.label}: ${fmtN(c.raw)}`};
    const ex=charts.findIndex(c=>c.canvas.id==="cTraffic"); if(ex>-1){charts[ex].destroy();charts.splice(ex,1);}
    mk("cTraffic",{type:"bar",data:{labels,datasets:ds},options:o2});
    document.querySelectorAll("#segTraffic button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===key));
  }
  drawTraffic();
  document.querySelectorAll("#segTraffic button").forEach(b=>b.onclick=()=>{state.traffic=b.dataset.v;drawTraffic();});

  /* daily table */
  function drawGrid(){
    let h=`<thead><tr><th class="l">Date</th>${ACCTS.map(a=>`<th title="${a}">${SHORT[a]}<small>${PIC[a]||""}</small></th>`).join("")}<th>Portfolio target</th>${pk?`<th>${pmd.m.short} (same day)</th>`:""}<th>Actual</th><th>Ach.</th></tr></thead><tbody>`;
    const tot={}; ACCTS.forEach(a=>tot[a]={g:0,t:0}); let tg_=0,ta_=0;
    m.days.forEach((d,i)=>{
      const has=md.hasData[i], t=md.tgtDay[i], a=md.actDay[i];
      h+=`<tr class="${has?"":"nodata"}"><td class="l dcol"><b>${m.short} ${d.day}</b> <span class="muted">${d.dow}</span>${d.ev?`<span class="ev">${d.ev}</span>`:""}</td>`;
      ACCTS.forEach(ac=>{
        const g=m.g[ac][i], tg=m.tgt[ac][i];
        if(!has){ h+=`<td class="num muted">${fmtC(tg)}</td>`; return; }
        if(g==null){ h+=`<td class="num muted" title="no data file">n/a</td>`; return; }
        tot[ac].g+=g; tot[ac].t+=tg;
        const p=tg>0?g/tg*100:null, c=status(p).c;
        h+=`<td class="num gc ${c}">${fmtC(g)} <span>(${p==null?"–":Math.round(p)+"%"})</span></td>`;
      });
      h+=`<td class="num">${fmtC(t)}</td>`;
      if(pk){ const pv=pmd.actDay[i]; const dl=(has&&pv)?(a/pv-1)*100:null;
        h+=`<td class="num muted">${pv!=null?fmtC(pv):"–"}${dl!=null?` <span class="${dl>=0?"pos":"neg"}">(${dl>=0?"+":"−"}${Math.abs(dl).toFixed(0)}%)</span>`:""}</td>`; }
      if(has){ ta_+=a; tg_+=t; h+=`<td class="num"><b>${fmtC(a)}</b></td><td>${pillHtml(a/t*100)}</td>`; }
      else h+=`<td class="num muted">–</td><td class="muted">–</td>`;
      h+=`</tr>`;
    });
    h+=`<tr class="tot"><td class="l dcol">Total to date</td>${ACCTS.map(ac=>{const x=tot[ac],p=x.t>0?x.g/x.t*100:null;return `<td class="num gc ${status(p).c}">${fmtC(x.g)} <span>(${p==null?"–":Math.round(p)+"%"})</span></td>`;}).join("")}<td class="num">${fmtC(tg_)}</td>${pk?"<td></td>":""}<td class="num">${fmtC(ta_)}</td><td>${pillHtml(ta_/tg_*100)}</td></tr></tbody>`;
    document.getElementById("tDaily").innerHTML=h;
  }
  drawGrid();
}
function acctStatsPrev(md,pmd,last){
  const out={};
  ACCTS.forEach(a=>{ let g=0; for(let i=0;i<=last;i++){ if(!md.hasData[i]) continue; g+=pmd.m.g[a][i]||0; } out[a]=g; });
  return out;
}

/* ---------- render: compare ---------- */
function renderCompare(){
  const mds=ORDER.map(model);
  const minN=Math.min(...mds.map(x=>x.last+1));
  const scope=state.cmpScope, N=scope==="same"?minN:null;
  const idx = md => scope==="same"?minN-1:md.last;
  const rows=mds.map(md=>{
    const up=idx(md); let g=0,t=0,days=0;
    for(let i=0;i<=up;i++){ if(!md.hasData[i]) continue; g+=md.actDay[i]; t+=md.tgtDay[i]; days++; }
    return {md,g,t,days,ach:g/t*100,avg:g/days,full:sum(md.tgtDay)};
  });
  const colors=["--s1","--s2","--s3"];
  let html=`<section class="card"><div class="chead"><div><h2>Month-over-month</h2><div class="hint">${scope==="same"?`Same period for every month: day 1–${minN} (latest month has ${minN} days of data)`:"Each month over all days with data"}</div></div>
    <div class="seg" id="segScope"><button data-v="same">Same days (1–${minN})</button><button data-v="full">All available days</button></div></div>
    <div class="scroll"><table><thead><tr><th class="l">Month</th><th>Days</th><th>Target</th><th>GMV</th><th class="l">Achievement</th><th>Avg / day</th><th>vs previous month</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const pr=i>0?rows[i-1]:null;
    html+=`<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(${colors[i]});margin-right:8px"></i>${r.md.m.label}</td><td class="num">${r.days}</td><td class="num muted">${fmtN(r.t)}</td><td class="num">${fmtN(r.g)}</td><td class="l">${pillHtml(r.ach)}</td><td class="num">${fmtC(r.avg)}</td><td class="num">${pr?deltaHtml(r.avg,pr.avg):"<span class='muted'>–</span>"}</td></tr>`;
  });
  html+=`</tbody></table></div><div class="hint" style="margin-top:8px">“vs previous month” compares average GMV per day, so months of different length are comparable.</div></section>`;

  html+=`<section class="card"><div class="chead"><div><h2>Daily GMV by month</h2><div class="hint">Same day of month, all months overlaid</div></div></div>
    <div class="legend">${rows.map((r,i)=>`<span><i class="ln" style="background:var(${colors[i]})"></i>${r.md.m.label}</span>`).join("")}</div>
    <div class="chartbox"><canvas id="cCmp" role="img" aria-label="Daily GMV by month"></canvas></div></section>`;

  // account matrix
  html+=`<section class="card"><div class="chead"><div><h2>Account achievement by month</h2><div class="hint">Achievement vs target for the period selected above · GMV underneath</div></div></div><div class="scroll"><table id="tMat"></table></div></section>`;

  // brand share
  html+=`<section class="card"><div class="chead"><div><h2>Brand mix by month</h2><div class="hint">Share of GMV for the period selected above</div></div></div>
    <div class="legend">${Object.keys(BRANDS).map(b=>`<span><i style="background:var(${DATA.brandColors[b]})"></i>${b}</span>`).join("")}</div>
    <div class="chartbox" style="height:240px"><canvas id="cMix" role="img" aria-label="Brand mix by month"></canvas></div></section>`;
  html+=`<footer><div>Months have different targets and campaign calendars, so compare achievement % as well as raw GMV. Bostanten Fashion was added to the portfolio mid-August (its August GMV is backfilled).</div></footer>`;
  const main=document.getElementById("main"); main.innerHTML=html;

  document.querySelectorAll("#segScope button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.v===scope);b.onclick=()=>{state.cmpScope=b.dataset.v;rerender();};});

  const maxN=Math.max(...mds.map(x=>x.n));
  const o=baseOpts(); o.scales.y.ticks.callback=v=>fmtC(v);
  o.scales.x.title={display:true,text:"Day of month",color:css("--ink-3"),font:{size:11}};
  o.plugins.tooltip.callbacks={title:i=>"Day "+i[0].label,label:c=>c.raw==null?null:` ${c.dataset.label}: ${fmtRp(c.raw)}`};
  mk("cCmp",{type:"line",data:{labels:Array.from({length:maxN},(_,i)=>i+1),datasets:mds.map((md,i)=>({label:md.m.label,data:Array.from({length:maxN},(_,d)=>md.actDay[d]!=null?md.actDay[d]:null),borderColor:css(colors[i]),backgroundColor:css(colors[i]),borderWidth:2,pointRadius:2,pointHoverRadius:5,tension:.25,spanGaps:false}))},options:o});

  // matrix
  const per=mds.map(md=>acctStats(md,idx(md)));
  let mh=`<thead><tr><th class="l">Account</th><th class="l">Specialist</th>${rows.map(r=>`<th>${r.md.m.label}</th>`).join("")}</tr></thead><tbody>`;
  ACCTS.forEach(a=>{
    mh+=`<tr><td>${a}</td><td class="l muted">${PIC[a]||"–"}</td>`;
    per.forEach(p=>{ const s=p.find(x=>x.a===a); const c=status(s.ach).c; mh+=`<td><span class="cell ${c}">${s.ach==null?"–":s.ach.toFixed(1)+"%"}</span><div class="muted num" style="font-size:11px;margin-top:2px">${fmtC(s.g)}</div></td>`; });
    mh+=`</tr>`;
  });
  mh+=`<tr class="tot"><td>Total</td><td></td>${rows.map(r=>`<td><span class="cell ${status(r.ach).c}">${r.ach.toFixed(1)}%</span><div class="num" style="font-size:11px;margin-top:2px">${fmtC(r.g)}</div></td>`).join("")}</tr></tbody>`;
  document.getElementById("tMat").innerHTML=mh;

  // mix
  const bnames=Object.keys(BRANDS);
  const share=mds.map((md,i)=>{ const s=per[i]; const tot=sum(s.map(x=>x.g)); return bnames.map(b=>sum(s.filter(x=>BRANDS[b].includes(x.a)).map(x=>x.g))/tot*100); });
  const o3=baseOpts(); o3.indexAxis="y"; o3.scales.x={stacked:true,max:100,grid:{color:css("--grid")},ticks:{color:css("--ink-3"),callback:v=>v+"%"},border:{display:false}}; o3.scales.y={stacked:true,grid:{display:false},ticks:{color:css("--ink-2"),font:{size:12}},border:{display:false}};
  o3.interaction={mode:"nearest",intersect:true};
  o3.plugins.tooltip.callbacks={label:c=>` ${c.dataset.label}: ${c.raw.toFixed(1)}%`};
  mk("cMix",{type:"bar",data:{labels:mds.map(x=>x.m.label),datasets:bnames.map((b,bi)=>({label:b,data:share.map(s=>s[bi]),backgroundColor:css(DATA.brandColors[b]),borderColor:css("--surface"),borderWidth:2,borderRadius:3,barThickness:34}))},options:o3});
}

/* ---------- shell ---------- */
function buildTabs(){
  const t=document.getElementById("tabs");
  t.innerHTML=ORDER.map(k=>{const md=model(k);return `<button class="tab" role="tab" data-k="${k}">${M[k].label}<small>${md.complete?"full month":"day 1–"+M[k].days[md.last].day}</small></button>`;}).join("")+`<button class="tab" role="tab" data-k="cmp">Compare months</button>`;
  t.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.month=b.dataset.k;rerender();});
}
function rerender(){
  killCharts();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.k===state.month));
  if(state.month==="cmp") renderCompare(); else renderMonth(state.month);
  try{ history.replaceState(null,"","#"+state.month); }catch(e){}
  const lastK=ORDER[ORDER.length-1], md=model(lastK);
  document.getElementById("asof").innerHTML=`Data through<b>${M[lastK].label.split(' ')[0]} ${M[lastK].days[md.last].day}, 2026</b>`;
}
const h=(location.hash||"").replace("#","");
if(ORDER.includes(h)||h==="cmp") state.month=h;
buildTabs(); rerender();
if(window.matchMedia) void 0;
if(typeof Chart==="undefined") document.getElementById("main").insertAdjacentHTML("afterbegin",`<div class="note">Charts could not load (Chart.js CDN blocked). Tables below still work.</div>`);
})();
</script>
</body>
</html>
