<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MIGO Live">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TikTok Live GMV Dashboard · MIGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#f8f8f6; --line:#e4e3de; --grid:#ecebe7;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a8984;
  --hdr:#10223d; --hdr-ink:#ffffff; --hdr-ink-2:rgba(255,255,255,.62);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --target:#0b0b0b;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --bad:#d03b3b; --bad-ink:#a42a2a;
  --good-bg:#e6f5e6; --warn-bg:#fdf1d3; --bad-bg:#fae6e6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
header{background:var(--hdr);color:var(--hdr-ink);padding:22px 32px 0}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:20px;font-weight:650;letter-spacing:-.2px}
.sub{font-size:12.5px;color:var(--hdr-ink-2);margin-top:3px}
.asof{font-size:12px;color:var(--hdr-ink-2);text-align:right}
.asof b{color:var(--hdr-ink);font-weight:600;display:block;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:20px;overflow-x:auto}
.tab{appearance:none;border:0;background:transparent;color:var(--hdr-ink-2);font:inherit;font-weight:600;font-size:13.5px;padding:10px 20px;border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--hdr-ink)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab small{font-weight:500;opacity:.7;margin-left:6px;font-size:11px}
main{max-width:1320px;margin:0 auto;padding:22px 32px 48px}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--s1);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);font-weight:600}
.kpi .v{font-size:22px;font-weight:650;margin-top:5px;letter-spacing:-.4px}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:99px}
.pill.good{background:var(--good-bg);color:var(--good-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.bad{background:var(--bad-bg);color:var(--bad-ink)}
.pill.flat{background:var(--surface-2);color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.card h2{font-size:14px;font-weight:650}
.card .hint{font-size:12px;color:var(--ink-3);margin-top:2px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px}
.grid2 .card{margin-bottom:0}
.sec{margin-bottom:18px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);padding:5px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.chartbox{position:relative;height:300px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:2px;width:14px;border-radius:0;vertical-align:3px}
.legend i.dash{height:0;width:14px;border-top:2px dashed;background:none;border-radius:0;vertical-align:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:650;border-top:1px solid var(--line);background:var(--surface-2)}
.rank{color:var(--ink-3);width:24px;display:inline-block}
.bar{display:inline-block;vertical-align:middle;width:56px;height:7px;background:var(--grid);border-radius:4px;overflow:hidden;margin-right:8px}
.bar>span{display:block;height:100%;border-radius:4px}
.muted{color:var(--ink-3)}
.pos{color:var(--good-ink)} .neg{color:var(--bad-ink)}
.scroll{overflow-x:auto}
.brandwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:center}
.brandwrap .chartbox{height:170px;max-width:220px;margin:0 auto;width:100%}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hl>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.hl .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);font-weight:600}
.hl .b{font-weight:650;font-size:15px;margin-top:2px}
.hl .d{font-size:12px;color:var(--ink-2)}
.picrow{display:grid;grid-template-columns:90px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid)}
.picrow:last-child{border-bottom:0}
.picrow .n{font-weight:650}
.picrow .a{font-size:11.5px;color:var(--ink-3)}
.picrow .tr{height:9px;background:var(--grid);border-radius:5px;overflow:hidden;position:relative}
.picrow .tr>span{display:block;height:100%;border-radius:5px}
.picrow .tr:after{content:"";position:absolute;left:100%;top:-2px;bottom:-2px;width:0}
.picrow .p{text-align:right;font-weight:650}
details.card>summary{cursor:pointer;font-weight:650;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-summary{display:none}
details.card>summary::after{content:"Show ▾";font-size:12px;color:var(--ink-3);font-weight:600}
details.card[open]>summary::after{content:"Hide ▴"}
.cell{display:inline-block;min-width:46px;text-align:center;border-radius:5px;padding:1px 5px;font-size:12px;font-weight:600}
.cell.good{background:var(--good-bg);color:var(--good-ink)}
.cell.warn{background:var(--warn-bg);color:var(--warn-ink)}
.cell.bad{background:var(--bad-bg);color:var(--bad-ink)}
.cell.none{color:var(--ink-3)}
.ev{font-size:10.5px;font-weight:650;color:var(--s2);margin-left:6px}

.act{border-left:4px solid var(--bad)}
.act.ok{border-left-color:var(--good)}
.act .std{font-size:12px;color:var(--ink-2);margin-top:2px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.ac{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ac .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ac .rk{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--bad-ink)}
.ac .nm{font-size:16px;font-weight:700;margin-top:6px}
.ac .pc{font-size:12px;color:var(--ink-3)}
.ac .big{display:flex;gap:18px;margin-top:10px}
.ac .big div{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px}
.ac .big b{display:block;font-size:17px;color:var(--ink);text-transform:none;letter-spacing:-.2px;margin-top:2px}
.ac .dx{font-size:12.5px;color:var(--ink-2);margin-top:10px;line-height:1.5}
.ac .dx b{color:var(--ink)}
.ac .todo{font-size:12.5px;margin-top:8px;padding:8px 10px;background:var(--bad-bg);color:var(--bad-ink);border-radius:7px;line-height:1.45}
.ac .warnx{font-size:11.5px;margin-top:8px;color:var(--warn-ink)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:var(--bad-bg);color:var(--bad-ink);border-radius:4px;padding:1px 6px;margin-left:8px}
@media (max-width:1000px){.acts{grid-template-columns:1fr}}

.snap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.snap .sh{background:#16213a;color:#fff;padding:22px 26px 18px}
.snap .srow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.snap h2{font-size:19px;font-weight:700;letter-spacing:-.3px}
.snap .ss{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:4px}
.snap .sd{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 16px;text-align:center}
.snap .sd b{display:block;font-size:15px}
.snap .sd span{font-size:10.5px;color:rgba(255,255,255,.55)}
.snap .tp{display:flex;align-items:center;gap:14px;margin-top:18px;font-size:12.5px;color:rgba(255,255,255,.65)}
.snap .tpb{flex:1;height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.snap .tpb i{display:block;height:100%;background:#5b9cf5;border-radius:4px}
.snap .tpv{font-weight:700;color:#7db0ff;font-size:14px}
.snap table{width:100%}
.snap th{background:var(--surface-2)}
.snap td{padding:13px 12px}
.snap .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;font-size:13.5px;white-space:nowrap}
.snap .sub{display:block;font-family:inherit;font-size:11px;font-weight:600;margin-top:3px}
.snap .sub.pos{color:var(--good-ink)}.snap .sub.neg{color:var(--bad-ink)}
.snap .rk2{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--grid);align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.snap .gp{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px}
.snap .gp.pos{background:var(--good-bg);color:var(--good-ink)}.snap .gp.neg{background:var(--bad-bg);color:var(--bad-ink)}

#tDaily{border-collapse:separate;border-spacing:0;min-width:1100px}
#tDaily thead th{background:#1a1f2b;color:#fff;font-size:11.5px;text-transform:none;letter-spacing:0;padding:10px 10px;position:sticky;top:0}
#tDaily thead th small{display:block;font-weight:500;color:rgba(255,255,255,.55);font-size:10.5px;margin-top:2px}
#tDaily thead th:first-child{border-top-left-radius:8px}#tDaily thead th:last-child{border-top-right-radius:8px}
#tDaily td{padding:9px 10px;white-space:nowrap}
#tDaily .dcol{position:sticky;left:0;background:var(--surface);z-index:1;min-width:120px}
#tDaily thead .dcol{background:#1a1f2b}
#tDaily .gc{font-weight:650}#tDaily .gc span{font-weight:500;font-size:11.5px}
#tDaily .gc.good{color:var(--good-ink)}#tDaily .gc.warn{color:var(--warn-ink)}#tDaily .gc.bad{color:var(--bad-ink)}
#tDaily .pos{color:var(--good-ink)}#tDaily .neg{color:var(--bad-ink)}
#tDaily tr.nodata td{color:var(--ink-3)}
#tDaily tr.tot td{background:var(--surface-2);font-weight:700}#tDaily tr.tot .dcol{background:var(--surface-2)}

.ov .kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 16px}
.ov .kp div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ov .kp small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);font-weight:600}
.ov .kp b{display:block;font-size:20px;margin-top:4px;letter-spacing:-.3px}
.ov .kp span{font-size:12px;color:var(--ink-2)}
.ov .chn{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;background:var(--grid);color:var(--ink-2)}
.ov .chn.sp{background:#fde8dc;color:#a8441a}.ov .chn.tk{background:#e3edfb;color:#1d58a8}
.ov .gp{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;white-space:nowrap}.ov .gp.pos{background:var(--good-bg);color:var(--good-ink)}.ov .gp.neg{background:var(--bad-bg);color:var(--bad-ink)}
.ov tr.ovt td{background:var(--surface-2);font-weight:700}
@media (max-width:1000px){.ov .kp{grid-template-columns:repeat(2,minmax(0,1fr))}}
#tAna{min-width:1180px}
#tAna tr:not(.dxr):not(.tot) td{border-bottom:0;padding-bottom:4px}
#tAna tr.dxr td{padding-top:0;padding-bottom:12px}
#tAna th.sh{cursor:pointer;user-select:none}
#tAna th.sh:hover{color:var(--ink)}
#tAna th[aria-sort]{color:var(--ink)}
#tAna .ar{font-size:9px;margin-left:4px;opacity:.6}
#tAna td{vertical-align:top}
#tAna td.dx{white-space:normal;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
#tAna td.dx div{max-width:1080px;position:sticky;left:10px}
#tAna td.dx div:before{content:"→ ";color:var(--ink-3)}
#tAna td.dx b{color:var(--ink)}
.sel{font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
footer{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.7}
.hidden{display:none!important}
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  main{padding:16px}
  header{padding:18px 16px 0}
  .brandwrap{grid-template-columns:1fr}
}
/* ================= premium theme layer ================= */
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#faf9f6; --line:#e8e5dd; --grid:#efede7;
  --ink:#0e1320; --ink-2:#4a4f5c; --ink-3:#8b8f99;
  --hdr:#0b1220; --hdr-ink:#ffffff; --hdr-ink-2:rgba(255,255,255,.55);
  --gold:#c6a664; --gold-2:#e3cf9f;
  --s1:#2f5aa8; --s2:#c97a3d; --s3:#2e8f6f; --s4:#c9a23f; --s5:#b45c7e;
  --target:#0e1320;
  --good:#1f8a5b; --good-ink:#17694a; --warn:#c99a2e; --warn-ink:#8a6516; --bad:#b9443c; --bad-ink:#9a3530;
  --good-bg:#e9f4ee; --warn-bg:#faf2df; --bad-bg:#f8e9e7;
  --shadow:0 1px 2px rgba(14,19,32,.04),0 12px 32px -18px rgba(14,19,32,.18);
}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1,"ss01" 1;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
header{background:radial-gradient(1200px 400px at 85% -20%,rgba(198,166,100,.16),transparent 60%),radial-gradient(900px 380px at 0% 0%,rgba(47,90,168,.22),transparent 60%),linear-gradient(180deg,#0b1220 0%,#0f1830 100%);padding:30px 40px 0;border-bottom:1px solid rgba(198,166,100,.35)}
.brand{display:flex;align-items:center;gap:14px}
.mono{width:54px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.1em;color:#0b1220;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 6px 18px -6px rgba(198,166,100,.6)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.sub{font-size:12.5px;color:var(--hdr-ink-2);margin-top:4px}
.asof{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--hdr-ink-2);border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:12px;padding:10px 16px}
.asof b{font-size:14px;letter-spacing:-.01em;text-transform:none;margin-top:3px;font-weight:600}
.tabs{margin-top:26px;gap:2px}
.tab{font-size:13px;font-weight:500;padding:12px 13px 14px;border-radius:0;position:relative;color:rgba(255,255,255,.55);letter-spacing:.005em}
.tab small{font-size:10.5px;opacity:.55;font-weight:500}
.tab[aria-selected="true"]{background:transparent;color:#fff}
.tab[aria-selected="true"]:after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold-2),var(--gold))}
main{max-width:1360px;padding:32px 40px 64px}
.card,.kpi,.snap{border:1px solid var(--line);box-shadow:var(--shadow)}
.card{border-radius:18px;padding:24px 26px;margin-bottom:22px}
.card h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.card .hint{font-size:12px;color:var(--ink-3);margin-top:4px}
.chead{margin-bottom:18px}
.kpis{gap:16px;margin-bottom:22px}
.kpi{border-radius:18px;padding:20px 22px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent 70%);opacity:.7}
.kpi .l{font-size:10.5px;letter-spacing:.16em;font-weight:600;color:var(--ink-3)}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.03em;margin-top:10px;line-height:1.1}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:6px}
.grid2{gap:22px}
.sec{margin-bottom:22px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;letter-spacing:.01em;border:1px solid transparent}
.pill.good{border-color:rgba(31,138,91,.18)} .pill.warn{border-color:rgba(201,154,46,.22)} .pill.bad{border-color:rgba(185,68,60,.18)}
.seg{border-radius:999px;padding:3px;background:var(--surface-2)}
.seg button{border-radius:999px;font-weight:500;padding:6px 14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.sel{border-radius:999px;padding:6px 14px;font-weight:500;background:var(--surface)}
.card>.chead:only-child{margin-bottom:0}
th{font-size:10px;letter-spacing:.08em;font-weight:600;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px 12px;border-bottom:1px solid var(--grid)}
tbody tr{transition:background .15s}
tbody tr:hover td{background:#fbfaf7}
tr.tot td{background:var(--surface-2);border-top:1px solid var(--line)}
.note{border-radius:12px;border-left-color:var(--gold)}
.legend{font-size:11.5px;color:var(--ink-3);gap:18px}
.legend i{border-radius:50%;width:8px;height:8px}
.cell{border-radius:999px;font-weight:600;font-size:11.5px;padding:2px 8px}
.hl>div,.ac,.ov .kp div{border-radius:14px}
.act{border-left:3px solid var(--bad)} .act.ok{border-left-color:var(--good)}
.ac .todo{border-radius:10px}
.snap{border-radius:20px}
.snap .sh{background:radial-gradient(800px 300px at 90% -30%,rgba(198,166,100,.18),transparent 60%),linear-gradient(180deg,#0b1220,#111b33);padding:28px 30px 22px}
.snap h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
.snap .tpb i{background:linear-gradient(90deg,var(--gold-2),var(--gold))}
.snap .tpv{color:var(--gold-2)}
.snap .m{font-family:inherit;font-weight:600}

    m.days.forEach((d,i)=>{

      h+=`<tr class="${has?"":"nodata"}"><td class="l dcol"><b>${m.short} ${d.day}</b> <span class="muted">${d.dow}</span>${d.ev?`<span class="ev">${d.ev}</span>`:""}</td>`;
      ACCTS.forEach(ac=>{
        const g=m.g[ac][i], tg=m.tgt[ac][i];
        if(!has){ h+=`<td class="num muted">${fmtC(tg)}</td>`; return; }
        if(g==null){ h+=`<td class="num muted" title="no data file">n/a</td>`; return; }
        tot[ac].g+=g; tot[ac].t+=tg;
        const p=tg>0?g/tg*100:null, c=status(p).c;
        h+=`<td class="num gc ${c}">${fmtC(g)} <span>(${p==null?"–":Math.round(p)+"%"})</span></td>`;
      });
      h+=`<td class="num">${fmtC(t)}</td>`;
      if(pk){ const pv=pmd.actDay[i]; const dl=(has&&pv)?(a/pv-1)*100:null;
        h+=`<td class="num muted">${pv!=null?fmtC(pv):"–"}${dl!=null?` <span class="${dl>=0?"pos":"neg"}">(${dl>=0?"+":"−"}${Math.abs(dl).toFixed(0)}%)</span>`:""}</td>`; }
      if(has){ ta_+=a; tg_+=t; h+=`<td class="num"><b>${fmtC(a)}</b></td><td>${pillHtml(a/t*100)}</td>`; }
      else h+=`<td class="num muted">–</td><td class="muted">–</td>`;
      h+=`</tr>`;
    });
    h+=`<tr class="tot"><td class="l dcol">Total to date</td>${ACCTS.map(ac=>{const x=tot[ac],p=x.t>0?x.g/x.t*100:null;return `<td class="num gc ${status(p).c}">${fmtC(x.g)} <span>(${p==null?"–":Math.round(p)+"%"})</span></td>`;}).join("")}<td class="num">${fmtC(tg_)}</td>${pk?"<td></td>":""}<td class="num">${fmtC(ta_)}</td><td>${pillHtml(ta_/tg_*100)}</td></tr></tbody>`;
    document.getElementById("tDaily").innerHTML=h;
  }
  drawGrid();
}
function acctStatsPrev(md,pmd,last){
  const out={};
  ACCTS.forEach(a=>{ let g=0; for(let i=0;i<=last;i++){ if(!md.hasData[i]) continue; g+=pmd.m.g[a][i]||0; } out[a]=g; });
  return out;
}

/* ---------- render: compare ---------- */
function renderCompare(){
  const mds=ORDER.filter(k=>!M[k].noTarget).map(model);
  const minN=Math.min(...mds.map(x=>x.last+1));
  const scope=state.cmpScope, N=scope==="same"?minN:null;
  const idx = md => scope==="same"?minN-1:md.last;
  const rows=mds.map(md=>{
    const up=idx(md); let g=0,t=0,days=0;
    for(let i=0;i<=up;i++){ if(!md.hasData[i]) continue; g+=md.actDay[i]; t+=md.tgtDay[i]; days++; }
    return {md,g,t,days,ach:g/t*100,avg:g/days,full:sum(md.tgtDay)};
  });
  const colors=["--s1","--s2","--s3"];
  let html=`<section class="card"><div class="chead"><div><h2>Month-over-month</h2><div class="hint">${scope==="same"?`Same period for every month: day 1–${minN} (latest month has ${minN} days of data)`:"Each month over all days with data"}</div></div>
    <div class="seg" id="segScope"><button data-v="same">Same days (1–${minN})</button><button data-v="full">All available days</button></div></div>
    <div class="scroll"><table><thead><tr><th class="l">Month</th><th>Days</th><th>Target</th><th>GMV</th><th class="l">Achievement</th><th>Avg / day</th><th>vs previous month</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const pr=i>0?rows[i-1]:null;
    html+=`<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(${colors[i]});margin-right:8px"></i>${r.md.m.label}</td><td class="num">${r.days}</td><td class="num muted">${fmtN(r.t)}</td><td class="num">${fmtN(r.g)}</td><td class="l">${pillHtml(r.ach)}</td><td class="num">${fmtC(r.avg)}</td><td class="num">${pr?deltaHtml(r.avg,pr.avg):"<span class='muted'>–</span>"}</td></tr>`;
  });
  html+=`</tbody></table></div><div class="hint" style="margin-top:8px">“vs previous month” compares average GMV per day, so months of different length are comparable.</div></section>`;

  html+=`<section class="card"><div class="chead"><div><h2>Daily GMV by month</h2><div class="hint">Same day of month, all months overlaid</div></div></div>
    <div class="legend">${rows.map((r,i)=>`<span><i class="ln" style="background:var(${colors[i]})"></i>${r.md.m.label}</span>`).join("")}</div>
    <div class="chartbox"><canvas id="cCmp" role="img" aria-label="Daily GMV by month"></canvas></div></section>`;

  // account matrix
  html+=`<section class="card"><div class="chead"><div><h2>Account achievement by month</h2><div class="hint">Achievement vs target for the period selected above · GMV underneath</div></div></div><div class="scroll"><table id="tMat"></table></div></section>`;

  // brand share
  html+=`<section class="card"><div class="chead"><div><h2>Brand mix by month</h2><div class="hint">Share of GMV for the period selected above</div></div></div>
    <div class="legend">${Object.keys(BRANDS).map(b=>`<span><i style="background:var(${DATA.brandColors[b]})"></i>${b}</span>`).join("")}</div>
    <div class="chartbox" style="height:240px"><canvas id="cMix" role="img" aria-label="Brand mix by month"></canvas></div></section>`;
  html+=`<footer><div>Months have different targets and campaign calendars, so compare achievement % as well as raw GMV. Bostanten Fashion was added to the portfolio mid-August (its August GMV is backfilled).</div></footer>`;
  const main=document.getElementById("main"); main.innerHTML=html;

  document.querySelectorAll("#segScope button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.v===scope);b.onclick=()=>{state.cmpScope=b.dataset.v;rerender();};});

  const maxN=Math.max(...mds.map(x=>x.n));
  const o=baseOpts(); o.scales.y.ticks.callback=v=>fmtC(v);
  o.scales.x.title={display:true,text:"Day of month",color:css("--ink-3"),font:{size:11}};
  o.plugins.tooltip.callbacks={title:i=>"Day "+i[0].label,label:c=>c.raw==null?null:` ${c.dataset.label}: ${fmtRp(c.raw)}`};
  mk("cCmp",{type:"line",data:{labels:Array.from({length:maxN},(_,i)=>i+1),datasets:mds.map((md,i)=>({label:md.m.label,data:Array.from({length:maxN},(_,d)=>md.actDay[d]!=null?md.actDay[d]:null),borderColor:css(colors[i]),backgroundColor:css(colors[i]),borderWidth:2,pointRadius:2,pointHoverRadius:5,tension:.25,spanGaps:false}))},options:o});

  // matrix
  const per=mds.map(md=>acctStats(md,idx(md)));
  let mh=`<thead><tr><th class="l">Account</th><th class="l">Specialist</th>${rows.map(r=>`<th>${r.md.m.label}</th>`).join("")}</tr></thead><tbody>`;
  ACCTS.forEach(a=>{
    mh+=`<tr><td>${a}</td><td class="l muted">${PIC[a]||"–"}</td>`;
    per.forEach(p=>{ const s=p.find(x=>x.a===a); const c=status(s.ach).c; mh+=`<td><span class="cell ${c}">${s.ach==null?"–":s.ach.toFixed(1)+"%"}</span><div class="muted num" style="font-size:11px;margin-top:2px">${fmtC(s.g)}</div></td>`; });
    mh+=`</tr>`;
  });
  mh+=`<tr class="tot"><td>Total</td><td></td>${rows.map(r=>`<td><span class="cell ${status(r.ach).c}">${r.ach.toFixed(1)}%</span><div class="num" style="font-size:11px;margin-top:2px">${fmtC(r.g)}</div></td>`).join("")}</tr></tbody>`;
  document.getElementById("tMat").innerHTML=mh;

  // mix
  const bnames=Object.keys(BRANDS);
  const share=mds.map((md,i)=>{ const s=per[i]; const tot=sum(s.map(x=>x.g)); return bnames.map(b=>sum(s.filter(x=>BRANDS[b].includes(x.a)).map(x=>x.g))/tot*100); });
  const o3=baseOpts(); o3.indexAxis="y"; o3.scales.x={stacked:true,max:100,grid:{color:css("--grid")},ticks:{color:css("--ink-3"),callback:v=>v+"%"},border:{display:false}}; o3.scales.y={stacked:true,grid:{display:false},ticks:{color:css("--ink-2"),font:{size:12}},border:{display:false}};
  o3.interaction={mode:"nearest",intersect:true};
  o3.plugins.tooltip.callbacks={label:c=>` ${c.dataset.label}: ${c.raw.toFixed(1)}%`};
  mk("cMix",{type:"bar",data:{labels:mds.map(x=>x.m.label),datasets:bnames.map((b,bi)=>({label:b,data:share.map(s=>s[bi]),backgroundColor:css(DATA.brandColors[b]),borderColor:css("--surface"),borderWidth:2,borderRadius:3,barThickness:34}))},options:o3});
}

/* ---------- render: account analysis ---------- */
function renderAccounts(){
  const ks=ORDER.filter(k=>!M[k].noTarget && prevOf(k) && model(k).last>=0);
  if(!ks.length){ document.getElementById("main").innerHTML=`<div class="card">Not enough months to compare yet.</div>`; return; }
  if(!state.accMonth||!ks.includes(state.accMonth)) state.accMonth=ks[ks.length-1];
  if(!state.accSort) state.accSort={key:"cTot",dir:1};
  if(!state.accBrand) state.accBrand="all";
  const k=state.accMonth, md=model(k), m=md.m, pk=prevOf(k), pmd=model(pk), pm=pmd.m;
  const last=md.last, daysLeft=md.n-(last+1);
  const idx=[]; for(let i=0;i<=last;i++) if(md.hasData[i]) idx.push(i);
  const pidx=idx.filter(i=>i<pmd.n&&pmd.hasData[i]);
  const agg=(mm,a,ix)=>{let g=0,v=0,o=0,t=0;ix.forEach(i=>{g+=(mm.g[a]||[])[i]||0;v+=(mm.views[a]||[])[i]||0;o+=(mm.orders[a]||[])[i]||0;t+=(mm.tgt[a]||[])[i]||0;});return {g,v,o,t,d:ix.length};};
  const lmean=(a,b)=>a===b?a:(a-b)/(Math.log(a)-Math.log(b));
  // GMV per day = views/day × conversion × AOV  → LMDI split of the change (exact, no residual)
  function decompose(c,p){
    if(!(c.g>0&&c.v>0&&c.o>0&&p.g>0&&p.v>0&&p.o>0&&c.d&&p.d)) return null;
    const G1=p.g/p.d, G2=c.g/c.d, L=lmean(G2,G1)*c.d;
    const V1=p.v/p.d, V2=c.v/c.d, C1=p.o/p.v, C2=c.o/c.v, A1=p.g/p.o, A2=c.g/c.o;
    return {cV:L*Math.log(V2/V1), cC:L*Math.log(C2/C1), cA:L*Math.log(A2/A1), cTot:(G2-G1)*c.d,
      gPct:(G2/G1-1)*100, vPct:(V2/V1-1)*100, cPct:(C2/C1-1)*100, aPct:(A2/A1-1)*100, V2, C2, A2};
  }
  // continuous daily GMV series up to the selected month's last data day (for the 7-day trend)
  const series=a=>{const out=[];for(const kk of ORDER){const mm=model(kk);const lim=kk===k?last:mm.last;for(let i=0;i<=lim;i++){if(mm.hasData[i]) out.push((M[kk].g[a]||[])[i]||0);} if(kk===k) break;} return out;};
  const weeks=s=>{const w=[];for(let e=s.length;e-7>=0&&w.length<8;e-=7) w.unshift(sum(s.slice(e-7,e)));return w;};

  let rows=ACCTS.map(a=>{
    const c=agg(m,a,idx), p=agg(pm,a,pidx), dc=decompose(c,p);
    const brand=Object.keys(BRANDS).find(b=>BRANDS[b].includes(a))||"";
    const monthTgt=sum((m.tgt[a]||[]).map(v=>v||0));
    const ach=c.t>0?c.g/c.t*100:null;
    // forecast: GMV so far + remaining target x achievement rate of the last 7 data days (momentum, keeps campaign-day weighting)
    const r7=agg(m,a,idx.slice(-7)); const rate=r7.t>0?r7.g/r7.t:(c.t>0?c.g/c.t:null);
    const proj=md.complete?c.g:(rate!=null?c.g+Math.max(0,monthTgt-c.t)*rate:null);
    const projAch=monthTgt>0&&proj!=null?proj/monthTgt*100:null;
    const need=!md.complete&&daysLeft>0&&monthTgt>0?Math.max(0,monthTgt-c.g)/daysLeft:null;
    const w=weeks(series(a)); const wk=w.length>=2&&w[w.length-2]>0?(w[w.length-1]/w[w.length-2]-1)*100:null;
    const r={a,brand,pic:PIC[a]||"–",g:c.g,avg:c.d?c.g/c.d:0,ach,projAch,need,w,wk,cvr:c.v>0?c.o/c.v*100:null,vpd:c.d?c.v/c.d:null,...(dc||{})};
    if(dc){const ps=[["Traffic",dc.cV],["Conversion",dc.cC],["AOV",dc.cA]];const sg=dc.cTot>=0?1:-1;
      const main=ps.filter(x=>x[1]*sg>0).sort((x,y)=>Math.abs(y[1])-Math.abs(x[1]))[0]||ps.sort((x,y)=>Math.abs(y[1])-Math.abs(x[1]))[0];
      r.drv=main[0]; r.drvUp=dc.cTot>=0;}
    return r;
  });
  // peer ranks (1 = best of the portfolio)
  const rank=(key,dst)=>{rows.filter(r=>r[key]!=null).slice().sort((x,y)=>y[key]-x[key]).forEach((r,i)=>r[dst]=i+1);};
  rank("cvr","rC"); rank("vpd","rV");
  const nR=rows.filter(r=>r.cvr!=null).length;
  const avgCvr=(()=>{let o=0,v=0;ACCTS.forEach(a=>{const c=agg(m,a,idx);o+=c.o;v+=c.v;});return v?o/v*100:null;})();

  function diagnose(r){
    if(r.cTot==null) return `<span class="muted">Not enough data for a comparison.</span>`;
    const tips={Traffic:"more live hours, ads boost and short videos",Conversion:"host delivery, script, price and product line-up",AOV:"bundles and pushing higher-priced items"};
    let t;
    if(r.cTot<0){
      t=`<b>${r.drv} is the main drop</b> (${r.drv==="Traffic"?"views/day "+sgn(r.vPct):r.drv==="Conversion"?"CVR "+sgn(r.cPct):"AOV "+sgn(r.aPct)}) → focus on ${tips[r.drv]}.`;
      if(r.drv==="Traffic"&&r.cPct>0) t+=` Conversion is up, so the live itself is selling fine.`;
    } else {
      t=`<b>Growing, mainly from ${r.drv.toLowerCase()}</b>.`;
      const neg=[["Traffic",r.cV,r.vPct],["Conversion",r.cC,r.cPct],["AOV",r.cA,r.aPct]].filter(x=>x[1]<0).sort((x,y)=>x[1]-y[1])[0];
      if(neg&&Math.abs(neg[1])>Math.abs(r.cTot)*.3) t+=` Watch ${neg[0].toLowerCase()} (${sgn(neg[2])}).`;
    }
    if(r.rC&&r.rC>nR-3&&r.cvr<avgCvr) t+=` CVR is among the lowest in the portfolio (${r.cvr.toFixed(2)}% vs ${avgCvr.toFixed(2)}% average).`;
    if(!md.complete&&r.projAch!=null&&r.projAch<85) t+=` <span class="neg">At this pace it ends at ${r.projAch.toFixed(0)}% of target. Needs ${fmtC(r.need)}/day.</span>`;
    return t;
  }
  const sgn=v=>v==null||!isFinite(v)?"–":(v>=0?"+":"")+v.toFixed(0)+"%";
  const effHtml=(v,sub)=>v==null?`<span class="muted">–</span>`:`<span class="${v>=0?"pos":"neg"}">${v>=0?"+":"−"}${fmtC(Math.abs(v))}</span><div class="muted" style="font-size:11px;margin-top:2px">${sub}</div>`;
  function spark(w){
    if(!w||w.length<2) return `<span class="muted">–</span>`;
    const W=84,H=24,mx=Math.max(...w),mn=Math.min(...w),rg=mx-mn||1;
    const pts=w.map((v,i)=>`${(i/(w.length-1)*W).toFixed(1)},${(H-2-(v-mn)/rg*(H-4)).toFixed(1)}`).join(" ");
    const up=w[w.length-1]>=w[w.length-2], col=up?"var(--good)":"var(--bad)";
    const [lx,ly]=pts.split(" ").pop().split(",");
    return `<svg width="${W+4}" height="${H}" viewBox="-2 0 ${W+4} ${H}" style="vertical-align:middle" role="img" aria-label="Weekly GMV, last ${w.length} weeks"><polyline points="${pts}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2.6" fill="${col}"/></svg>`;
  }

  const shown=state.accBrand==="all"?rows:rows.filter(r=>r.brand===state.accBrand);
  const T=k2=>sum(shown.map(r=>r[k2]||0));
  const tot={g:T("g"),cTot:T("cTot"),cV:T("cV"),cC:T("cC"),cA:T("cA")};
  const prevTot=tot.g-tot.cTot;
  const declining=shown.filter(r=>r.cTot!=null&&r.cTot<0).length;
  const trafficLed=shown.filter(r=>r.cTot<0&&r.drv==="Traffic").length;
  const risk=shown.filter(r=>r.projAch!=null&&r.projAch<85).length;
  const period=pidx.length===idx.length?`day 1–${m.days[last].day} in both`:`${m.short} 1–${m.days[last].day} vs ${pm.short} 1–${pm.days[pidx[pidx.length-1]].day}, compared per day`;

  let html=`<section class="card"><div class="chead"><div><h2>Account analysis · ${m.label} vs ${pm.label}</h2>
      <div class="hint">Same days (${period}) · GMV per day = views/day × conversion × AOV, and the change is split into those three effects (in Rp)</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <div class="seg" id="segAccM">${ks.map(x=>`<button data-v="${x}">${M[x].short} vs ${M[prevOf(x)].short}</button>`).join("")}</div>
        <select id="selBrand" class="sel"><option value="all">All brands</option>${Object.keys(BRANDS).map(b=>`<option value="${b}">${b}</option>`).join("")}</select>
      </div></div></section>`;

  html+=`<section class="kpis">
    <div class="kpi"><div class="l">GMV change</div><div class="v num ${tot.cTot>=0?"pos":"neg"}">${tot.cTot>=0?"+":"−"}${fmtC(Math.abs(tot.cTot))}</div><div class="s">${prevTot>0?sgn(tot.cTot/prevTot*100):"–"} vs ${pm.short} same days</div></div>
    <div class="kpi"><div class="l">Traffic effect</div><div class="v num ${tot.cV>=0?"pos":"neg"}">${tot.cV>=0?"+":"−"}${fmtC(Math.abs(tot.cV))}</div><div class="s">from more / fewer views</div></div>
    <div class="kpi"><div class="l">Conversion effect</div><div class="v num ${tot.cC>=0?"pos":"neg"}">${tot.cC>=0?"+":"−"}${fmtC(Math.abs(tot.cC))}</div><div class="s">from orders per view</div></div>
    <div class="kpi"><div class="l">AOV effect</div><div class="v num ${tot.cA>=0?"pos":"neg"}">${tot.cA>=0?"+":"−"}${fmtC(Math.abs(tot.cA))}</div><div class="s">from basket size</div></div>
    <div class="kpi"><div class="l">Accounts declining</div><div class="v num">${declining} / ${shown.length}</div><div class="s">${trafficLed} traffic-led${md.complete?"":` · ${risk} forecast &lt;85%`}</div></div>
  </section>`;

  html+=`<section class="card"><div class="chead"><div><h2>All accounts</h2><div class="hint">Click any column header to sort · click again to reverse · effects are Rp of GMV gained / lost vs ${pm.short}</div></div></div>
    <div class="scroll"><table id="tAna" class="sortable"></table></div>
    <div class="hint" style="margin-top:10px">Forecast = GMV so far + the rest of the month&#39;s target &times; the achievement rate of the last 7 days (recent momentum counts, campaign days stay weighted). 7-day trend = GMV in rolling 7-day blocks, last 8 weeks; % is latest week vs the week before. Ranks are 1 = best of ${nR} accounts.</div></section>`;

  html+=`<section class="card"><div class="chead"><div><h2>What moved each account's GMV</h2><div class="hint">Rp effect of traffic, conversion and AOV vs ${pm.label}, same days</div></div></div>
    <div class="legend"><span><i style="background:var(--s1)"></i>Traffic</span><span><i style="background:var(--s3)"></i>Conversion</span><span><i style="background:var(--s4)"></i>AOV</span></div>
    <div class="chartbox" style="height:${Math.max(220,shown.length*34+60)}px"><canvas id="cDrv" role="img" aria-label="GMV change by driver per account"></canvas></div></section>`;

  document.getElementById("main").innerHTML=html;
  document.querySelectorAll("#segAccM button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.v===k);b.onclick=()=>{state.accMonth=b.dataset.v;rerender();};});
  const sb=document.getElementById("selBrand"); sb.value=state.accBrand; sb.onchange=()=>{state.accBrand=sb.value;rerender();};

  const COLS=[
    {k:"a",t:"Account",l:1,s:"str"},
    {k:"g",t:"GMV"},
    {k:"gPct",t:"GMV/day vs "+pm.short},
    {k:"cV",t:"Traffic effect"},
    {k:"cC",t:"Conversion effect"},
    {k:"cA",t:"AOV effect"},
    {k:"drv",t:"Main driver",l:1,s:"str"},
    {k:"ach",t:"Ach. to date",l:1},
    ...(md.complete?[]:[{k:"projAch",t:"Forecast",l:1},{k:"need",t:"Need / day"}]),
    {k:"wk",t:"7-day trend"},
    {k:"rC",t:"CVR rank",asc:1},
    {k:"rV",t:"Traffic rank",asc:1}
  ];
  function drawTable(){
    const {key,dir}=state.accSort, col=COLS.find(c=>c.k===key)||COLS[1];
    const list=shown.slice().sort((x,y)=>{
      const a=x[key],b=y[key];
      if(a==null&&b==null) return 0; if(a==null) return 1; if(b==null) return -1;
      const r=col.s==="str"?String(a).localeCompare(String(b)):(a-b);
      return r*dir;
    });
    let h=`<thead><tr>${COLS.map(c=>{const on=c.k===key;return `<th class="${c.l?"l":""}${c.k?" sh":""}" ${c.k?`data-k="${c.k}"`:""} ${on?`aria-sort="${dir>0?"ascending":"descending"}"`:""}>${c.t}${c.k?`<span class="ar">${on?(dir>0?"▲":"▼"):"↕"}</span>`:""}</th>`;}).join("")}</tr></thead><tbody>`;
    list.forEach(r=>{
      const drv=r.drv?`<span class="pill ${r.drvUp?"good":"bad"}">${r.drvUp?"▲":"▼"} ${r.drv}</span>`:`<span class="muted">–</span>`;
      h+=`<tr><td><b>${r.a}</b><div class="muted" style="font-size:11px">${r.brand} · ${r.pic}</div></td>
        <td class="num">${fmtC(r.g)}<div class="muted" style="font-size:11px">${fmtC(r.avg)}/day</div></td>
        <td class="num">${r.gPct==null?"<span class='muted'>–</span>":`<span class="${r.gPct>=0?"pos":"neg"}">${r.gPct>=0?"▲":"▼"} ${Math.abs(r.gPct).toFixed(1)}%</span>`}</td>
        <td class="num">${effHtml(r.cV,`views/day ${sgn(r.vPct)}`)}</td>
        <td class="num">${effHtml(r.cC,`CVR ${r.cvr==null?"–":r.cvr.toFixed(2)+"%"} (${sgn(r.cPct)})`)}</td>
        <td class="num">${effHtml(r.cA,`AOV ${r.A2?fmtC(r.A2):"–"} (${sgn(r.aPct)})`)}</td>
        <td class="l">${drv}</td>
        <td class="l">${r.ach==null?"<span class='muted'>–</span>":pillHtml(r.ach)}</td>
        ${md.complete?"":`<td class="l">${r.projAch==null?"<span class='muted'>–</span>":pillHtml(r.projAch)}</td><td class="num">${r.need==null?"–":fmtC(r.need)}<div class="muted" style="font-size:11px">now ${fmtC(r.avg)}</div></td>`}
        <td class="num">${spark(r.w)}<div style="font-size:11px">${r.wk==null?"<span class='muted'>–</span>":`<span class="${r.wk>=0?"pos":"neg"}">${sgn(r.wk)} wk</span>`}</div></td>
        <td class="num">${r.rC?`#${r.rC}`:"–"}</td>
        <td class="num">${r.rV?`#${r.rV}`:"–"}</td></tr>
        <tr class="dxr"><td colspan="${COLS.length}" class="l dx"><div>${diagnose(r)}</div></td></tr>`;
    });
    h+=`<tr class="tot"><td>Total${state.accBrand==="all"?"":" · "+state.accBrand}</td><td class="num">${fmtC(tot.g)}</td><td class="num">${prevTot>0?sgn(tot.cTot/prevTot*100):"–"}</td>
      <td class="num">${effHtml(tot.cV,"")}</td><td class="num">${effHtml(tot.cC,"")}</td><td class="num">${effHtml(tot.cA,"")}</td><td colspan="${COLS.length-6}"></td></tr></tbody>`;
    const el=document.getElementById("tAna"); el.innerHTML=h;
    el.querySelectorAll("th.sh").forEach(th=>th.onclick=()=>{
      const kk=th.dataset.k, c=COLS.find(x=>x.k===kk);
      if(state.accSort.key===kk) state.accSort.dir*=-1; else state.accSort={key:kk,dir:(c.s==="str"||c.asc)?1:-1};
      drawTable();
    });
  }
  drawTable();

  const ord=shown.filter(r=>r.cTot!=null).sort((x,y)=>x.cTot-y.cTot);
  const o=baseOpts(); o.indexAxis="y";
  o.scales.x={stacked:true,grid:{color:css("--grid")},ticks:{color:css("--ink-3"),font:{size:11},callback:v=>fmtC(v)},border:{display:false}};
  o.scales.y={stacked:true,grid:{display:false},ticks:{color:css("--ink-2"),font:{size:12}},border:{display:false}};
  o.plugins.tooltip.callbacks={label:c=>` ${c.dataset.label}: ${c.raw>=0?"+":"−"}Rp ${fmtN(Math.abs(c.raw))}`,footer:it=>"Net GMV change: "+(ord[it[0].dataIndex].cTot>=0?"+":"−")+"Rp "+fmtN(Math.abs(ord[it[0].dataIndex].cTot))};
  mk("cDrv",{type:"bar",data:{labels:ord.map(r=>SHORT[r.a]||r.a),datasets:[
    {label:"Traffic",data:ord.map(r=>r.cV),backgroundColor:css("--s1"),borderColor:css("--surface"),borderWidth:1,barThickness:20},
    {label:"Conversion",data:ord.map(r=>r.cC),backgroundColor:css("--s3"),borderColor:css("--surface"),borderWidth:1,barThickness:20},
    {label:"AOV",data:ord.map(r=>r.cA),backgroundColor:css("--s4"),borderColor:css("--surface"),borderWidth:1,barThickness:20}]},options:o});
}

/* ================= quick wins: shared helpers ================= */
const MONTH_IDX={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const YEAR=2026;
const IDDAY={Mon:"Senin",Tue:"Selasa",Wed:"Rabu",Thu:"Kamis",Fri:"Jumat",Sat:"Sabtu",Sun:"Minggu"};
const pctS=v=>(v==null||!isFinite(v))?"–":(v>=0?"+":"−")+Math.abs(v*100).toFixed(0)+"%";
const DOWS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const LATEST=()=>{const k=ORDER.filter(x=>model(x).last>=0).pop();return {k,md:model(k)};};
function series(a){ // daily rows across all months; a = account name, or null for the whole portfolio
  const out=[];
  ORDER.forEach(k=>{const md=model(k),m=md.m;for(let i=0;i<=md.last;i++){ if(!md.hasData[i]) continue; const d=m.days[i];
    const pick=f=>a?(((m[f]||{})[a]||[])[i]||0):sum(ACCTS.map(x=>(((m[f]||{})[x]||[])[i]||0)));
    out.push({k,i,day:d.day,dow:d.dow,ev:d.ev||"",g:pick("g"),v:pick("views"),o:pick("orders"),t:pick("tgt")}); }});
  return out;
}
function weekBlocks(s,n){const w=[];for(let e=s.length;e-7>=0&&w.length<n;e-=7) w.unshift(sum(s.slice(e-7,e)));return w;}
function sparkSvg(w,W=84,H=24){
  if(!w||w.length<2) return `<span class="muted">–</span>`;
  const mx=Math.max(...w),mn=Math.min(...w),rg=mx-mn||1;
  const pts=w.map((v,i)=>`${(i/(w.length-1)*W).toFixed(1)},${(H-2-(v-mn)/rg*(H-4)).toFixed(1)}`);
  const up=w[w.length-1]>=w[w.length-2]; const [lx,ly]=pts[pts.length-1].split(",");
  return `<svg width="${W+4}" height="${H}" viewBox="-2 0 ${W+4} ${H}" style="vertical-align:middle" role="img" aria-label="Weekly trend"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2.6" fill="${up?"var(--good)":"var(--bad)"}"/></svg>`;
}

/* ---------- alerts ---------- */
function computeAlerts(){
  const res=[];
  ACCTS.forEach(a=>{
    const s=series(a); if(s.length<14) return;
    const N=3, w=s.slice(-N).filter(x=>!x.ev), base=s.slice(-N-28,-N).filter(x=>!x.ev);
    if(base.length<10||w.length<2) return;
    const bv=sum(base.map(x=>x.v))/base.length, bvs=sum(base.map(x=>x.v)), bc=bvs?sum(base.map(x=>x.o))/bvs:0, bg=sum(base.map(x=>x.g))/base.length;
    const vd=w.map(x=>bv?x.v/bv-1:0);
    if(vd.every(x=>x<-.15)){const av=sum(vd)/vd.length;res.push({a,type:"bad",sev:-av,tag:"Traffic",en:`views ${pctS(av)} vs 4-week normal, ${w.length} days in a row`,id:`views ${pctS(av)} vs normal 4 minggu, ${w.length} hari berturut-turut`});}
    const cd=w.map(x=>x.v&&bc?(x.o/x.v)/bc-1:0);
    if(cd.every(x=>x<-.15)){const av=sum(cd)/cd.length;res.push({a,type:"bad",sev:-av,tag:"Conversion",en:`conversion ${pctS(av)} vs 4-week normal, ${w.length} days in a row`,id:`konversi ${pctS(av)} vs normal 4 minggu, ${w.length} hari berturut-turut`});}
    const y=s[s.length-1];
    if(y.t>0&&y.g/y.t<.6) res.push({a,type:"bad",sev:1-y.g/y.t,tag:"Target",en:`latest day only ${Math.round(y.g/y.t*100)}% of daily target (${fmtC(y.g)} vs ${fmtC(y.t)})`,id:`hari terakhir hanya ${Math.round(y.g/y.t*100)}% dari target harian (${fmtC(y.g)} vs ${fmtC(y.t)})`});
    const gd=sum(w.map(x=>x.g))/w.length/bg-1;
    if(gd>.25) res.push({a,type:"good",sev:gd,tag:"Momentum",en:`GMV ${pctS(gd)} above 4-week normal over the last ${w.length} days`,id:`GMV ${pctS(gd)} di atas normal 4 minggu selama ${w.length} hari terakhir`});
  });
  // one line per account for problems: keep its most severe issue, mention the others
  const byA={};res.filter(r=>r.type==="bad").forEach(r=>{(byA[r.a]=byA[r.a]||[]).push(r);});
  const bad=Object.values(byA).map(l=>{l.sort((x,y)=>y.sev-x.sev);const r={...l[0]};r.more=l.slice(1);return r;}).sort((x,y)=>y.sev-x.sev).slice(0,5);
  const good=res.filter(r=>r.type==="good").sort((x,y)=>y.sev-x.sev).slice(0,2);
  return {bad,good};
}
function alertsHtml(){
  const {k,md}=LATEST(), d=M[k].days[md.last], {bad,good}=computeAlerts();
  const row=r=>`<div class="al ${r.type}"><span class="dot"></span><b>${r.a}</b><span class="atag">${r.tag}</span><span class="atx">${r.en}${r.more&&r.more.length?` · also ${r.more.map(x=>x.tag.toLowerCase()).join(", ")}`:""}</span>${r.type==="bad"?`<button class="lnk" data-log="${r.a}">Log action →</button>`:""}</div>`;
  return `<section class="card alerts"><div class="chead"><div><h2>Today's alerts</h2><div class="hint">Automatic checks on the last 3 days (data through ${M[k].short} ${d.day}) vs each account's 4-week normal, campaign days excluded</div></div>
    <span class="pill ${bad.length?"bad":"good"}">${bad.length?`${bad.length} to check`:"All clear"}</span></div>
    ${bad.length?bad.map(row).join(""):`<div class="al good"><span class="dot"></span><span class="atx">No account is off its normal pattern.</span></div>`}
    ${good.length?`<div class="algap"></div>${good.map(row).join("")}`:""}</section>`;
}

/* ---------- campaigns ---------- */
function campaignList(){
  const fam=ev=>/payday/i.test(ev)?"Payday":/HUT/.test(ev)?"HUT RI":ev.replace(/^(Pre-|Post-)/,"");
  const list=[];
  ORDER.forEach(k=>{const m=M[k];let cur=null;
    m.days.forEach((d,i)=>{ if(!d.ev){cur=null;return;} const f=fam(d.ev);
      if(!cur||cur.name!==f){cur={k,name:f,label:(f==="Payday"||f==="HUT RI")?`${f} ${m.short}`:f,big:/^\d+\.\d+$/.test(f),idx:[]};list.push(cur);}
      cur.idx.push(i);});});
  list.forEach(c=>{
    const md=model(c.k),m=md.m; c.md=md;
    c.start=m.days[c.idx[0]].day; c.end=m.days[c.idx[c.idx.length-1]].day;
    c.date=new Date(YEAR,MONTH_IDX[c.k]??0,c.start);
    c.have=c.idx.filter(i=>md.hasData[i]&&i<=md.last);
    c.status=c.have.length===0?"upcoming":c.have.length<c.idx.length?"live":"done";
    c.acc={}; ACCTS.forEach(a=>{let g=0,t=0,tAll=0;c.idx.forEach(i=>tAll+=(m.tgt[a]||[])[i]||0);c.have.forEach(i=>{g+=(m.g[a]||[])[i]||0;t+=(m.tgt[a]||[])[i]||0;});c.acc[a]={g,t,tAll,ach:t>0?g/t*100:null};});
    c.g=sum(ACCTS.map(a=>c.acc[a].g)); c.t=sum(ACCTS.map(a=>c.acc[a].t)); c.tAll=sum(ACCTS.map(a=>c.acc[a].tAll));
    c.ach=c.t>0?c.g/c.t*100:null;
    const nd=[];for(let i=0;i<=md.last;i++) if(md.hasData[i]&&!m.days[i].ev) nd.push(md.actDay[i]);
    c.normal=nd.length?sum(nd)/nd.length:null;
    c.uplift=c.have.length&&c.normal?(c.g/c.have.length)/c.normal:null;
  });
  return list;
}
function nextCampaign(list){
  const now=new Date(); now.setHours(0,0,0,0);
  const c=list.find(x=>x.status!=="done")||null; if(!c) return null;
  c.daysTo=Math.round((c.date-now)/864e5);
  c.prev=list.filter(x=>x.status==="done"&&x.big===c.big&&(c.big||x.name===c.name)).pop()||null;
  return c;
}

        ${nx.status==="live"?`<div><small>So far</small><b>${fmtC(nx.g)}</b><span>${nx.ach!=null?nx.ach.toFixed(0)+"% of target to date":""}</span></div>`:""}

/* ---------- team & patterns ---------- */
function renderTeam(){
  if(!state.hmMetric) state.hmMetric="g";
  const {k,md}=LATEST(), m=md.m, pk=prevOf(k), pmd=pk?model(pk):null;
  const idx=[];for(let i=0;i<=md.last;i++) if(md.hasData[i]) idx.push(i);
  const pics=[...new Set(ACCTS.map(a=>PIC[a]).filter(Boolean))];
  const cards=pics.map(p=>{
    const ac=ACCTS.filter(a=>PIC[a]===p);
    let g=0,t=0,pg=0;ac.forEach(a=>idx.forEach(i=>{g+=(m.g[a]||[])[i]||0;t+=(m.tgt[a]||[])[i]||0;if(pmd&&i<pmd.n&&pmd.hasData[i]) pg+=(pmd.m.g[a]||[])[i]||0;}));
    const days=[];const ss=ac.map(a=>series(a));ss[0].forEach((_,j)=>days.push(sum(ss.map(s=>s[j]?s[j].g:0))));

  html+=`<section class="card"><div class="chead"><div><h2>Day-of-week pattern</h2><div class="hint">Last 8 weeks, campaign days excluded · 100 = the account's normal day · green = stronger day, red = weaker day</div></div>

    <div class="scroll"><table id="tHm"></table></div>

  document.getElementById("main").innerHTML=html;

  ents.forEach(([a,label],ri)=>{
    const s=series(a).slice(-56).filter(x=>!x.ev);
    const val=list=>{if(!list.length) return null; if(met==="g") return sum(list.map(x=>x.g))/list.length; if(met==="v") return sum(list.map(x=>x.v))/list.length; const v=sum(list.map(x=>x.v)); return v?sum(list.map(x=>x.o))/v:null;};

    const ok=ix.map((v,i)=>[v,i]).filter(x=>x[0]!=null); const best=ok.slice().sort((x,y)=>y[0]-x[0])[0], worst=ok.slice().sort((x,y)=>x[0]-y[0])[0];

/* ---------- morning brief ---------- */
function briefData(){
  const {k,md}=LATEST(), m=md.m, L=md.last, d=m.days[L];
  const s=series(null), y=s[s.length-1], wk=s.length>7?s[s.length-8]:null;
  let G=0,T=0;for(let i=0;i<=L;i++) if(md.hasData[i]){G+=md.actDay[i];T+=md.tgtDay[i];}
  const mt=m.target||sum(md.tgtDay); const l7=s.filter(x=>x.k===k).slice(-7);
  const rate=sum(l7.map(x=>x.t))?sum(l7.map(x=>x.g))/sum(l7.map(x=>x.t)):G/T;
  const proj=md.complete?G:G+Math.max(0,mt-T)*rate;
  const acc=ACCTS.map(a=>{const g=(m.g[a]||[])[L]||0,t=(m.tgt[a]||[])[L]||0;return {a,g,ach:t>0?g/t*100:null};}).filter(x=>x.ach!=null).sort((x,y)=>y.ach-x.ach);
  const nx=nextCampaign(campaignList());
  return {k,m,d,y,wk,G,T,mt,proj,acc,al:computeAlerts(),nx,date:`${d.dow}, ${d.day} ${m.short} ${YEAR}`};
}
function briefText(b,lang){

            :`Yesterday: GMV ${fmtC(b.y.g)} (${(b.y.g/b.y.t*100).toFixed(0)}% of daily target)${b.wk?`, ${pctS(b.y.g/b.wk.g-1)} vs last ${b.wk.dow}`:""}`);
  L.push(ID?`MTD: ${fmtC(b.G)} · ${(b.G/b.T*100).toFixed(1)}% dari target s/d hari ini · ${(b.G/b.mt*100).toFixed(1)}% dari target bulanan`
            :`MTD: ${fmtC(b.G)} · ${(b.G/b.T*100).toFixed(1)}% of target to date · ${(b.G/b.mt*100).toFixed(1)}% of monthly target`);
  L.push(ID?`Proyeksi akhir bulan: ${fmtC(b.proj)} (${(b.proj/b.mt*100).toFixed(0)}% dari target ${fmtC(b.mt)})`:`Month-end forecast: ${fmtC(b.proj)} (${(b.proj/b.mt*100).toFixed(0)}% of ${fmtC(b.mt)} target)`);
  L.push("");
  L.push(ID?`✅ Terbaik kemarin:`:`✅ Best yesterday:`);

const MN3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MKEYS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const dateOf=(k,day)=>new Date(YEAR,MONTH_IDX[k],day);
const fmtD=d=>`${d.getDate()} ${MN3[d.getMonth()]}`;
const isoD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const _ser={}; function serC(a){const key=a||"__all";return _ser[key]||(_ser[key]=series(a).map(x=>({...x,date:dateOf(x.k,x.day)})));}
const PICS=()=>[...new Set(ACCTS.map(a=>PIC[a]).filter(Boolean))];
const TIPS={Traffic:"more live hours, ads boost and short videos",Conversion:"host delivery, script, vouchers, price and product line-up",AOV:"bundles and pushing higher-priced items"};
function lmean(a,b){return a===b?a:(a-b)/(Math.log(a)-Math.log(b));}
function splitDrivers(c,p){ // c,p = {g,v,o,d}; returns Rp effects of traffic/conversion/AOV on GMV (period of c)
  if(!(c.g>0&&c.v>0&&c.o>0&&p.g>0&&p.v>0&&p.o>0&&c.d&&p.d)) return null;
  const G1=p.g/p.d,G2=c.g/c.d,L=lmean(G2,G1)*c.d;
  return {cV:L*Math.log((c.v/c.d)/(p.v/p.d)),cC:L*Math.log((c.o/c.v)/(p.o/p.v)),cA:L*Math.log((c.g/c.o)/(p.g/p.o)),cTot:(G2-G1)*c.d,
    gP:G2/G1-1,vP:(c.v/c.d)/(p.v/p.d)-1,cP:(c.o/c.v)/(p.o/p.v)-1,aP:(c.g/c.o)/(p.g/p.o)-1};
}
function mainDriver(dr){ if(!dr) return null; const ps=[["Traffic",dr.cV,dr.vP],["Conversion",dr.cC,dr.cP],["AOV",dr.cA,dr.aP]];
  const sg=dr.cTot>=0?1:-1; const m=ps.filter(x=>x[1]*sg>0).sort((x,y)=>Math.abs(y[1])-Math.abs(x[1]))[0]||ps.sort((x,y)=>Math.abs(y[1])-Math.abs(x[1]))[0];
  return {name:m[0],pct:m[2],up:dr.cTot>=0}; }
function acctMonth(a){ // latest month vs previous month, same days + momentum forecast
  const {k,md}=LATEST(), m=md.m, pk=prevOf(k), pmd=pk?model(pk):null;
  const idx=[];for(let i=0;i<=md.last;i++) if(md.hasData[i]) idx.push(i);
  const ag=(mm,ix)=>{let g=0,v=0,o=0,t=0;ix.forEach(i=>{g+=(mm.g[a]||[])[i]||0;v+=(mm.views[a]||[])[i]||0;o+=(mm.orders[a]||[])[i]||0;t+=(mm.tgt[a]||[])[i]||0;});return {g,v,o,t,d:ix.length};};
  const c=ag(m,idx), p=pmd?ag(pmd.m,idx.filter(i=>i<pmd.n&&pmd.hasData[i])):null;
  const l7=ag(m,idx.slice(-7)), mt=sum((m.tgt[a]||[]).map(v=>v||0));
  const rate=l7.t>0?l7.g/l7.t:(c.t>0?c.g/c.t:1), remTgt=Math.max(0,mt-c.t), remBase=md.complete?0:remTgt*rate;
  const proj=c.g+remBase, daysLeft=md.n-(md.last+1);
  return {a,k,c,p,dr:p?splitDrivers(c,p):null,mt,ach:c.t>0?c.g/c.t*100:null,proj,projAch:mt>0?proj/mt*100:null,remBase,remTgt,rate,daysLeft,
    need:daysLeft>0?Math.max(0,mt-c.g)/daysLeft:null,avg:c.d?c.g/c.d:0,vpd7:l7.d?l7.v/l7.d:0,complete:md.complete};
}
function fixLine(x){
  const md=mainDriver(x.dr);
  if(!md) return "Not enough data to compare yet.";
  if(!md.up) return `<b>${md.name} is the main drop</b> (${pctS(md.pct)} vs ${M[prevOf(x.k)].short}) → focus on ${TIPS[md.name]}.`;
  const neg=[["Traffic",x.dr.cV,x.dr.vP],["Conversion",x.dr.cC,x.dr.cP],["AOV",x.dr.cA,x.dr.aP]].filter(z=>z[1]<0).sort((p,q)=>p[1]-q[1])[0];

}

function loadActions(){

const actSig=x=>[x.date,String(x.a||"").toLowerCase(),String(x.note||"").replace(/\s+/g," ").trim().toLowerCase().slice(0,80)].join("|");

function actFastPoll(){ // while an action is waiting to appear, check every 20 s (for up to 15 min)
  ACT_POLL_END=Date.now()+15*60e3; if(ACT_POLL) return;

  const sh=new Set(sharedActs().map(actSig)), l=localActs(), keep=l.filter(x=>!sh.has(actSig(x)));

function actImpact(x){
  const s=serC(x.a), d=new Date(x.date+"T00:00:00");
  const before=s.filter(r=>r.date<=d).slice(-7), after=s.filter(r=>r.date>d).slice(0,7);
  if(before.length<3) return {st:"nodata"};
  if(after.length<3) return {st:"early",n:after.length};
  const S=(l,f)=>sum(l.map(r=>r[f]));
  const gP=(S(after,"g")/after.length)/(S(before,"g")/before.length)-1;
  const vP=(S(after,"v")/after.length)/(S(before,"v")/before.length)-1;
  const cP=S(after,"v")&&S(before,"v")&&S(before,"o")?(S(after,"o")/S(after,"v"))/(S(before,"o")/S(before,"v"))-1:null;
  const achB=S(before,"t")?S(before,"g")/S(before,"t"):null, achA=S(after,"t")?S(after,"g")/S(after,"t"):null;
  const dA=achA!=null&&achB!=null?achA-achB:null;
  const score=dA!=null?dA:gP; // achievement change is fairer: it cancels out campaign / payday days
  const verdict=score>.05?"worked":score<-.05?"worse":"flat";
  return {st:"ok",n:after.length,gP,vP,cP,dA,achA,achB,verdict};
}
function impactHtml(im){

}

    let o=`<section class="kpis"><div class="kpi"><div class="l">Current forecast</div><div class="v">${fmtC(B)}</div><div class="s">${MT?(B/MT*100).toFixed(0)+"% of target":""}</div></div>

/* ---------- 4. next-month target planner ---------- */
function renderPlanner(){
  if(!state.plScen) state.plScen="real";
  const {k}=LATEST(), mi=MONTH_IDX[k], nm=(mi+1)%12, ny=mi===11?YEAR+1:YEAR, nk=MKEYS[nm];
  const nDays=new Date(ny,nm+1,0).getDate(), label=new Date(ny,nm,1).toLocaleString("en-US",{month:"long"})+" "+ny;
  // campaign calendar for next month: double date (pre / main / post) + payday 24–27
  const dd=nm+1, cal=Array.from({length:nDays},(_,i)=>{const day=i+1,dt=new Date(ny,nm,day);let ev="";
    if(day===dd-1) ev=`Pre-${dd}.${dd}`; if(day===dd) ev=`${dd}.${dd}`; if(day===dd+1) ev=`Post-${dd}.${dd}`;
    if(day>=24&&day<=27&&!ev) ev=day===24?"Payday Eve":"Payday";
    return {day,dow:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()],ev,big:/\d+\.\d+/.test(ev),pay:/Payday/.test(ev)};});
  const camps=campaignList().filter(c=>c.status==="done");
  const rows=ACCTS.map(a=>{
    const s=serC(a), ne=s.filter(r=>!r.ev);
    const l28=ne.slice(-28), base=l28.length?sum(l28.map(r=>r.g))/l28.length:0;
    const r14=ne.slice(-14), p14=ne.slice(-28,-14);
    const tr=p14.length&&sum(p14.map(r=>r.g))?Math.min(1.15,Math.max(.85,(sum(r14.map(r=>r.g))/r14.length)/(sum(p14.map(r=>r.g))/p14.length))):1;
    const w56=ne.slice(-56), all=w56.length?sum(w56.map(r=>r.g))/w56.length:0;
    const wd={};DOWS.forEach(d=>{const l=w56.filter(r=>r.dow===d);wd[d]=l.length&&all?Math.min(1.4,Math.max(.7,sum(l.map(r=>r.g))/l.length/all)):1;});
    const up=big=>{const l=camps.filter(c=>c.big===big&&(big||c.name==="Payday")).map(c=>{const md=c.md,m=md.m;const nd=[];for(let i=0;i<=md.last;i++) if(md.hasData[i]&&!m.days[i].ev) nd.push((m.g[a]||[])[i]||0);
      const n=nd.length?sum(nd)/nd.length:0;return n&&c.have.length?(c.acc[a].g/c.have.length)/n:null;}).filter(v=>v!=null&&isFinite(v));
      return l.length?Math.min(4,Math.max(.8,sum(l)/l.length)):(big?1.6:1.1);};
    const ub=up(true),up2=up(false);
    const daily=cal.map(d=>base*Math.sqrt(tr)*wd[d.dow]*(d.big?ub:d.pay?up2:1));
    const real=sum(daily);
    const cur=acctMonth(a);
    return {a,base,tr,ub,up2,daily,real,cons:real*.92,str:real*1.12,curT:cur.mt,curP:cur.proj};
  });
  const key=state.plScen, F={cons:.92,real:1,str:1.12}[key];
  const tot=f=>sum(rows.map(r=>r[f]));
  const {k:ck}=LATEST();

/* ---------- 5. weekly review ---------- */
function weekList(){
  const s=serC(null), byIso={};s.forEach(r=>byIso[isoD(r.date)]=r);
  const first=s[0].date,lastD=s[s.length-1].date;
  const mon=new Date(first);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const weeks=[];
  for(let d=new Date(mon);d<=lastD;d.setDate(d.getDate()+7)){
    const days=[];for(let j=0;j<7;j++){const x=new Date(d);x.setDate(x.getDate()+j);days.push(isoD(x));}
    const have=days.filter(x=>byIso[x]);
    if(have.length) weeks.push({start:new Date(d),days,have,complete:have.length===7});
  }
  return weeks;
}
function weekAgg(a,days){const set=new Set(days);const l=serC(a).filter(r=>set.has(isoD(r.date)));return {g:sum(l.map(r=>r.g)),v:sum(l.map(r=>r.v)),o:sum(l.map(r=>r.o)),t:sum(l.map(r=>r.t)),d:l.length,ev:[...new Set(l.filter(r=>r.ev).map(r=>r.ev.replace(/^(Pre-|Post-)/,"").replace(" Eve","")))],rows:l};}
function renderWeekly(){
  const weeks=weekList(); const comp=weeks.filter(w=>w.complete);
  const opts=weeks.slice(-7).reverse();
  if(!state.wk||!weeks.find(w=>isoD(w.start)===state.wk)) state.wk=isoD((comp[comp.length-1]||weeks[weeks.length-1]).start);
  const wi=weeks.findIndex(w=>isoD(w.start)===state.wk), W=weeks[wi], P=wi>0?weeks[wi-1]:null;
  // compare only the same weekdays when the week is still in progress
  const cmpDays=P?(W.complete?P.days:P.days.filter((_,j)=>W.days[j]&&W.have.includes(W.days[j]))):[];
  const end=new Date(W.start);end.setDate(end.getDate()+6);
  const wl=w=>{const e=new Date(w.start);e.setDate(e.getDate()+6);return `${fmtD(w.start)} – ${fmtD(e)}`;};
  const T=weekAgg(null,W.days), TP=P?weekAgg(null,cmpDays):null, dr=TP?splitDrivers(T,TP):null;
  const acc=ACCTS.map(a=>{const c=weekAgg(a,W.days),p=P?weekAgg(a,cmpDays):null,d=p?splitDrivers(c,p):null;return {a,c,p,d,ach:c.t?c.g/c.t*100:null,chg:p&&p.d?(c.g/c.d-p.g/p.d)*c.d:null,md:mainDriver(d)};});
  const wins=acc.filter(x=>x.chg>0).sort((p,q)=>q.chg-p.chg).slice(0,3), miss=acc.filter(x=>x.chg<0).sort((p,q)=>p.chg-q.chg).slice(0,3);
  const best=T.rows.slice().sort((p,q)=>q.g-p.g)[0];
  const pics=PICS().map(p=>{const as=acc.filter(x=>PIC[x.a]===p);const g=sum(as.map(x=>x.c.g)),t=sum(as.map(x=>x.c.t)),pg=sum(as.map(x=>x.p?x.p.g:0));return {p,g,ach:t?g/t*100:null,vs:pg?g/pg-1:null};}).sort((p,q)=>(q.ach??0)-(p.ach??0));
  // focus for the coming week
  const focus=[];
  acc.filter(x=>x.ach!=null&&x.ach<85).sort((p,q)=>p.ach-q.ach).slice(0,3).forEach(x=>focus.push(`<b>${x.a}</b> (${PIC[x.a]}) at ${x.ach.toFixed(0)}% of target${x.md&&!x.md.up?` · ${x.md.name.toLowerCase()} ${pctS(x.md.pct)} → ${TIPS[x.md.name]}`:""}.`));
  const nx=nextCampaign(campaignList());
  if(nx&&nx.status!=="done"){const rr={};ACCTS.forEach(a=>{const s=serC(a).slice(-7);rr[a]=s.length?sum(s.map(r=>r.g))/s.length:0;});
    const hard=ACCTS.map(a=>({a,m:rr[a]?nx.acc[a].tAll/nx.idx.length/rr[a]:0})).filter(x=>x.m>2.5).sort((p,q)=>q.m-p.m).map(x=>`${SHORT[x.a]||x.a} ${x.m.toFixed(1)}×`);
    focus.push(`<b>${nx.label}</b> ${nx.status==="live"?"is live":nx.daysTo>0?`in ${nx.daysTo} days`:"today"} (target ${fmtC(nx.tAll)}).${hard.length?` Biggest lift needed: ${hard.join(", ")}. Prepare stock, vouchers, KOL and ads early.`:" All accounts within reach of their campaign pace."}`);}
  if(dr){const md=mainDriver(dr);if(md&&!md.up) focus.push(`Portfolio GMV/day ${pctS(dr.gP)} week on week, mostly from <b>${md.name.toLowerCase()}</b> (${pctS(md.pct)}).`);}
  const evs=[...new Set([...T.ev,...(TP?TP.ev:[])])];
  let html=`<section class="card"><div class="chead"><div><h2>Weekly review · ${wl(W)}${W.complete?"":` <span class="pill warn">in progress · ${W.have.length}/7 days</span>`}</h2><div class="hint">Compared with ${P?wl(P):"–"}${!W.complete&&P?" (same weekdays only)":""}${evs.length?` · campaign days in these weeks: ${evs.join(", ")}`:""}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><select id="wkS" class="sel">${opts.map(w=>`<option value="${isoD(w.start)}">${wl(w)}${w.complete?"":" (in progress)"}</option>`).join("")}</select><button class="pbtn sm" id="wkCopy">Copy for meeting</button></div></div></section>`;
  html+=`<section class="kpis"><div class="kpi"><div class="l">Week GMV</div><div class="v">${fmtC(T.g)}</div><div class="s">${fmtC(T.g/T.d)}/day</div></div>
    <div class="kpi"><div class="l">vs previous week</div><div class="v ${dr&&dr.gP>=0?"pos":"neg"}">${dr?pctS(dr.gP):"–"}</div><div class="s">GMV per day</div></div>
    <div class="kpi"><div class="l">Achievement</div><div class="v">${T.t?(T.g/T.t*100).toFixed(1)+"%":"–"}</div><div class="s">vs ${fmtC(T.t)} target</div></div>
    <div class="kpi"><div class="l">What moved it</div><div class="v" style="font-size:18px;line-height:1.35">${dr?`<span class="${dr.cV>=0?"pos":"neg"}">Traffic ${dr.cV>=0?"+":"−"}${fmtC(Math.abs(dr.cV))}</span><br><span class="${dr.cC>=0?"pos":"neg"}">Conv. ${dr.cC>=0?"+":"−"}${fmtC(Math.abs(dr.cC))}</span>`:"–"}</div><div class="s">${dr?`AOV ${dr.cA>=0?"+":"−"}${fmtC(Math.abs(dr.cA))}`:""}</div></div>
    <div class="kpi"><div class="l">Best day</div><div class="v" style="font-size:22px">${best?`${best.dow} ${fmtD(best.date)}`:"–"}</div><div class="s">${best?fmtC(best.g)+(best.ev?" · "+best.ev:""):""}</div></div></section>`;
  const mv=(x,up)=>`<div class="mv"><div><b>${x.a}</b><div class="muted" style="font-size:11px">${PIC[x.a]||""}</div></div><div class="num ${up?"pos":"neg"}">${x.chg>=0?"+":"−"}${fmtC(Math.abs(x.chg))}<div class="muted" style="font-size:11px">${x.md?`${x.md.name} ${pctS(x.md.pct)}`:""}</div></div></div>`;
  html+=`<div class="grid2 eq sec"><section class="card"><div class="chead"><div><h2>🏆 Wins</h2><div class="hint">Biggest GMV gain vs previous week · main driver</div></div></div>${wins.length?wins.map(x=>mv(x,true)).join(""):`<div class="muted">No account grew.</div>`}</section>
    <section class="card"><div class="chead"><div><h2>⚠️ Misses</h2><div class="hint">Biggest GMV drop vs previous week · main driver</div></div></div>${miss.length?miss.map(x=>mv(x,false)).join(""):`<div class="muted">No account dropped.</div>`}</section></div>`;
  html+=`<section class="card focus"><div class="chead"><div><h2>🎯 Focus for this week</h2><div class="hint">Generated from the numbers. Edit in the meeting as needed.</div></div></div><ol>${focus.map(f=>`<li>${f}</li>`).join("")||"<li>All accounts at or above 85% of target. Keep the plan.</li>"}</ol></section>`;
  html+=`<div class="grid2 eq sec"><section class="card"><div class="chead"><div><h2>Specialists this week</h2><div class="hint">Achievement vs target · change vs previous week</div></div></div><table><tbody>${pics.map((p,i)=>`<tr><td><span class="rank">${i+1}</span>${esc(p.p)}</td><td class="num">${fmtC(p.g)}</td><td class="l">${pillHtml(p.ach)}</td><td class="num ${p.vs>=0?"pos":"neg"}">${p.vs==null?"–":pctS(p.vs)}</td></tr>`).join("")}</tbody></table></section>
    <section class="card"><div class="chead"><div><h2>All accounts this week</h2><div class="hint">Achievement vs target · GMV/day vs previous week</div></div></div><table><tbody>${acc.slice().sort((p,q)=>(q.ach??0)-(p.ach??0)).map(x=>`<tr><td>${x.a}</td><td class="num">${fmtC(x.c.g)}</td><td class="l">${pillHtml(x.ach)}</td><td class="num ${x.d&&x.d.gP>=0?"pos":"neg"}">${x.d?pctS(x.d.gP):"–"}</td></tr>`).join("")}</tbody></table></section></div>`;
  document.getElementById("main").innerHTML=html;
  const sel=document.getElementById("wkS");sel.value=state.wk;sel.onchange=()=>{state.wk=sel.value;rerender();};
  const plain=h=>h.replace(/<[^>]+>/g,"");

function oDrop(dragId,poolId,targetId){

  oChange(()=>{

    const T2=oFind(targetId);
    if(T2.n.t===node.t&&T2.p){T2.p.c.splice(T2.p.c.indexOf(T2.n),0,node);}
    else if(ORG_KIDS[T2.n.t]===node.t){T2.n.c.push(node);}

/* ---------- 1. data collection & validation ---------- */
function rValidate(a,P){

  add(rows.length===n,"Coverage",`${rows.length} of ${n} days have data${rows.length<n?` (missing: ${(()=>{const have=new Set(rows.map(r=>r.date));const miss=[];for(let d=P.s;d<=P.e&&miss.length<6;d=addDays(d,1)) if(!have.has(d)) miss.push(fmtDate(d).slice(0,-5));return miss.join(", ")+(n-rows.length>6?"…":"");})()})`:""}`,Math.min(30,Math.round((1-rows.length/n)*40)));

  add(!bad.length,"Consistency",bad.length?`${bad.length} days with impossible values (orders > views, negative GMV, or GMV without orders): ${bad.slice(0,4).map(r=>fmtDate(r.date).slice(0,-5)).join(", ")}`:"No impossible values found",Math.min(20,bad.length*5));
  const zero=rows.filter(r=>!r.g).length; add(!zero,"Zero-GMV days",zero?`${zero} days with zero GMV (no live, or data missing?)`:"No zero days",Math.min(10,zero*3));
  const rec=rows.filter(r=>r.g_up!=null);if(rec.length){const d=sum(rec.map(r=>r.g_up))/sum(rec.map(r=>r.g))-1;add(Math.abs(d)<=.05,"Upload vs dashboard GMV",`${pctS(d)} difference on ${rec.length} overlapping days${Math.abs(d)>.05?" (dashboard values used)":""}`,Math.abs(d)>.05?5:0);}
  const ext=["items","viewers","ctr_w","hrs"].filter(k=>rows.some(r=>r[k]!=null));

/* ---------- 2. account knowledge: monthly issue history (auto) + saved reports ---------- */
const _kc={};

    const P={s:`${ym}-01`,e:isoD(new Date(y,m,0))}, pv=ms[i-1], [py,pm]=pv.split("-").map(Number), C={s:`${pv}-01`,e:isoD(new Date(py,pm,0))};
    const lat=rLatestDate(a); const Pc={s:P.s,e:P.e>lat?lat:P.e}; const partial=Pc.e<P.e;
    const Cc=partial?{s:C.s,e:(()=>{const x=addDays(C.s,daysIn(Pc.s,Pc.e)-1);return x>C.e?C.e:x;})()}:C;

    out.push({ym,label:mLabel(ym)+(partial?" (to date)":""),P:Pc,C:Cc,keys,probs:ins.probs,dr:cmp.dr,snap,partial,g:cmp.pa.g,ach:snap.ach});});

function rIssueRegister(a,curKeys,curLabel,beforeIso){

  [...hist.map(h=>({label:h.label,keys:h.keys,e:h.P.e,s:h.P.s})),...rLibAll().filter(r=>r.account===a&&r.period.e<beforeIso&&r.probKeys).map(r=>({label:fmtRange(r.period),keys:r.probKeys,e:r.period.e,s:r.period.s}))]
    .forEach(p=>{const k=p.s+"|"+p.e;if(byRange[k]) byRange[k].keys=[...new Set([...byRange[k].keys,...p.keys])];else byRange[k]={...p};});
  // overlapping periods (e.g. a weekly report inside a month): keep the longer one so nothing is counted twice
  const periods=Object.values(byRange).sort((x,y)=>x.e.localeCompare(y.e)||x.s.localeCompare(y.s)).filter((p,i,arr)=>!arr.some(q=>q!==p&&q.s<=p.s&&q.e>=p.e&&(q.s!==p.s||q.e!==p.e)));
  const all=new Set([...curKeys,...periods.flatMap(p=>p.keys)]);

  return [...all].map(k=>{
    const seen=periods.filter(p=>p.keys.includes(k)), now=curKeys.includes(k), inPrev=prev&&prev.keys.includes(k);
    let streak=0;for(let i=periods.length-1;i>=0&&periods[i].keys.includes(k);i--) streak++;

  }).filter(x=>x.status!=="Inactive").sort((x,y)=>["Chronic","Recurring","Returned","New","Resolved"].indexOf(x.status)-["Chronic","Recurring","Returned","New","Resolved"].indexOf(y.status));
}

/* ---------- 3. strategy evaluation (post-implementation) ---------- */
function rEvalRec(a,rep,rec){

/* ---------- 4. opportunities & risks ---------- */

  const pv=cmp.rows.find(r=>r.m.k==="v"),pc=cmp.rows.find(r=>r.m.k==="cvr");
  if(pc&&pc.pct!=null&&pc.pct>5&&pv&&pv.pct!=null&&pv.pct<0) O.push({t:"Conversion is strong while traffic is down",d:`Every extra 1,000 views is worth about Rp ${fmtC(pa.g/pa.v*1000)} at the current conversion, so buying traffic has a high return now.`,kpi:"Views per day"});
  if(ins.tr!=null&&ins.tr>1) O.push({t:`Momentum inside the period: +${ins.tr.toFixed(1)}% of average per day`,d:"Keep the current setup and push volume while the trend is up.",kpi:"GMV per day"});
  const nx=nextCampaign(campaignList());if(nx&&ACCTS.includes(a)&&nx.acc[a]) O.push({t:`Next campaign: ${nx.label} (${nx.status==="live"?"live now":`starts ${fmtDate(isoD(nx.date))}`})`,d:`Campaign target Rp ${fmtC(nx.acc[a].tAll)}. Prepare stock, vouchers and ads in advance.`,kpi:"Campaign achievement"});
  const traj=rTrajectory(a,cmp.P.e);if(traj.label==="deteriorating") R.push({t:`Account is deteriorating (${pctS(traj.ch)} normal-day GMV over ${traj.ms.length} months)`,d:"Decline is structural, not a one-off; needs a plan beyond daily fixes.",lvl:"High"});

/* ---------- 5. continuous optimisation of recommendations ---------- */
function rOptimizeRecs(recs,a,cmp,ins,issues,strats,P){
  const pa=cmp.pa, R=k=>cmp.rows.find(r=>r.m.k===k);

    const k=rec.kpi.k, m=RMK[k], cur=R(k);

    if(rec.kpi.target==null&&rec.kpi.baseline!=null) rec.kpi.target=rec.kpi.baseline*(m.pp?1.05:1.1);

    if(failed.length&&failed[failed.length-1]===past[past.length-1]){rec.adapt="Changed approach";rec.action=REC_ALT[rec.id]+" (Original plan: "+rec.action.split(". ")[0]+".)";if(rec.priority!=="High") rec.priority="High";}
    else if(worked.length&&worked[worked.length-1]===past[past.length-1]){rec.adapt="Proven approach";rec.action=`Re-apply what worked in ${fmtRange(worked[worked.length-1].rep.period)}: ${worked[worked.length-1].rec.action}`;}
    if(iss&&iss.status==="Chronic"){rec.priority="High";rec.adapt=(rec.adapt?rec.adapt+" · ":"")+"Escalate";rec.action+=` Chronic issue (${iss.streak} periods in a row): escalate to the brand team with this report.`;}

    if(pend.length) rec.note=`A similar action from ${fmtRange(pend[pend.length-1].rep.period)} is still being evaluated (until ${fmtDate(pend[pend.length-1].win.e)}); avoid changing two things at once.`;
  });

  wb.SheetNames.forEach(sn=>{const rows=X.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null,blankrows:false});
    let best=null;for(let i=0;i<Math.min(25,rows.length);i++){const c=rDetect(rows[i]||[]);const sc=Object.keys(c).length;if(c.date!=null&&c.g!=null&&(!best||sc>best.sc)) best={i,c,sc};}

}
function rFileAccounts(sheets){const c={};sheets.forEach(s=>{if(s.cols.account==null) return;s.rows.forEach(r=>{const v=String(r[s.cols.account]||"").trim();if(v) c[v]=(c[v]||0)+1;});});return Object.entries(c).sort((x,y)=>y[1]-x[1]);}
function rGuessAccount(a,vals){const al=(R_FILE_ALIAS[a]||[a]).map(x=>x.toUpperCase());return vals.filter(([v])=>al.includes(v.toUpperCase())).map(([v])=>v);}
function rExtract(sheets,accVals){
  const days={},ses=[];let n=0;const set=new Set((accVals||[]).map(v=>v.toUpperCase()));
  sheets.forEach(s=>{const C=s.cols;s.rows.forEach(r=>{
    if(C.account!=null&&set.size&&!set.has(String(r[C.account]||"").trim().toUpperCase())) return;
    const d=rParseDate(r[C.date]);if(!d) return;const x=days[d]||(days[d]={});n++;
    const add=(k,v)=>{if(v!=null&&isFinite(v)) x[k]=(x[k]||0)+v;};
    const g=rNum(r[C.g]);add("g",g);
    ["o","items","v","viewers","imp","clicks","fol"].forEach(k=>{if(C[k]!=null) add(k,rNum(r[C[k]]));});
    if(C.likes!=null||C.comments!=null||C.shares!=null) add("eng",(rNum(r[C.likes])||0)+(rNum(r[C.comments])||0)+(rNum(r[C.shares])||0));
    const w=C.viewers!=null?(rNum(r[C.viewers])||0):1;
    if(C.ctr!=null&&C.imp==null){let c=rNum(r[C.ctr]);if(c!=null){if(c>1) c/=100;add("ctr_w",c*w);add("wv",w);}}
    if(C.ctor!=null&&C.clicks==null){let c=rNum(r[C.ctor]);if(c!=null){if(c>1) c/=100;add("ctor_w",c*w);add("wv2",w);}}

    if(C.host!=null||C.slot!=null||hrs!=null){add("hrs",hrs);add("sessions",1);

function rImport(a,file,ex){

function rChartCfg(b){

  if(b.kind==="change"){o.indexAxis="y";o.scales.x={grid:{color:"#efede7"},ticks:{callback:v=>v+"%",font:{size:10}}};o.scales.y={grid:{display:false},ticks:{font:{size:10.5}}};
    return {type:"bar",data:{labels:b.labels,datasets:[{data:b.vals,backgroundColor:b.vals.map(v=>v>=0?"#1f8a5b":"#b9443c"),maxBarThickness:14}]},options:o};}

    return {type:"bar",data:{labels:b.labels,datasets:[{data:b.vals,backgroundColor:"#2f5aa8",maxBarThickness:14}]},options:o};}

    return {type:"line",data:{labels:b.labels,datasets:[{label:b.l1,data:b.a,borderColor:"#2f5aa8",backgroundColor:"#2f5aa8",tension:.25,pointRadius:2},{label:b.l2,data:b.b,borderColor:"#c6a664",backgroundColor:"#c6a664",borderDash:[5,4],tension:.25,pointRadius:2}]},options:o};}

async function rChartPng(b,w=1000,h=420){
  const c=document.createElement("canvas");c.width=w;c.height=h;c.style.cssText=`position:fixed;left:-9999px;width:${w}px;height:${h}px`;document.body.appendChild(c);
  const cfg=rChartCfg(b);cfg.options.responsive=false;cfg.options.devicePixelRatio=1;cfg.options.maintainAspectRatio=false;

/* ---------- shared period helpers ---------- */
function rShiftMonth(iso,n){const d=new Date(iso+"T00:00:00"),t=new Date(d.getFullYear(),d.getMonth()+n,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return isoD(new Date(t.getFullYear(),t.getMonth(),Math.min(d.getDate(),last)));}
function rCompareFor(P,mode,custom){
  const len=daysIn(P.s,P.e);
  const fullMonth=P.s.slice(8)==="01"&&addDays(P.e,1).slice(8)==="01";
  if(mode==="prev"&&fullMonth) return {s:rShiftMonth(P.s,-1),e:addDays(P.s,-1)};
  if(mode==="prev") return {s:addDays(P.s,-len),e:addDays(P.s,-1)};
  if(mode==="mom"){
    if(fullMonth){const s=rShiftMonth(P.s,-1);return {s,e:addDays(P.s,-1)};} return {s:rShiftMonth(P.s,-1),e:rShiftMonth(P.e,-1)};}
  if(mode==="yoy"){const y=x=>x.replace(/^(\d{4})/,m=>String(+m-1));return {s:y(P.s),e:y(P.e)};}
  return custom&&custom.s&&custom.e?custom:null;
}
function rMonthsOf(a){return [...new Set(rDaily(a).map(x=>x.date.slice(0,7)))].sort().reverse();}
const mLabel=ym=>new Date(+ym.slice(0,4),+ym.slice(5)-1,1).toLocaleString("en-US",{month:"long",year:"numeric"});
function rAcctSelect(id,cur){return `<select id="${id}" class="sel"><optgroup label="TikTok (dashboard data built in)">${ACCTS.map(a=>`<option ${a===cur?"selected":""}>${esc(a)}</option>`).join("")}</optgroup><optgroup label="Upload-only (import a file first)">${R_UPLOAD_ONLY.map(a=>`<option ${a===cur?"selected":""}>${esc(a)}</option>`).join("")}</optgroup></select>`;}
function rFindingCard(f){return `<div class="fnd"><div class="fndh"><span class="cls c-${f.cls}">${f.cls}</span><b>${esc(f.title)}</b></div><dl>${f.what?`<dt>What changed</dt><dd>${esc(f.what)}</dd>`:""}${f.how?`<dt>By how much</dt><dd>${esc(f.how)}</dd>`:""}<dt>Why</dt><dd>${esc(f.why)}</dd><dt>Business impact</dt><dd>${esc(f.impact)}</dd><dt>Action</dt><dd>${esc(f.action)}</dd></dl></div>`;}
